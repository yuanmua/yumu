<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yumu · 方案二 工作台</title>
<link rel="stylesheet" href="shared.css?v=3">
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif;
  --type-body: 13px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 14px; --radius-xl: 18px;
  --bg-canvas: #F3F3F1; --bg-sidebar: #E9E9E6; --surface-default: #FFFFFF; --surface-elevated: #FFFFFF; --surface-sunken: #E8E8E5;
  --surface-hover: rgba(0,0,0,.045); --surface-pressed: rgba(0,0,0,.08);
  --border-subtle: rgba(0,0,0,.08); --border-strong: rgba(0,0,0,.16);
  --text-primary: #17181A; --text-secondary: #5F6368; --text-tertiary: #93979D;
  --success: #2F8A5A; --warning: #C6882A; --danger: #C9453B;
  --elev-raised: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.07);
  --elev-overlay: 0 2px 6px rgba(0,0,0,.08), 0 18px 50px rgba(0,0,0,.18);
  --primary-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent);
}
[data-theme="dark"] {
  --bg-canvas: #151617; --bg-sidebar: #0F1011; --surface-default: #1D1E20; --surface-elevated: #26272A; --surface-sunken: #0F1011;
  --surface-hover: rgba(255,255,255,.05); --surface-pressed: rgba(255,255,255,.09);
  --border-subtle: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
  --text-primary: #F2F2F0; --text-secondary: #A0A3A8; --text-tertiary: #65686E;
  --success: #4FB57D; --warning: #E0A94A; --danger: #E26B61;
  --elev-raised: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  --elev-overlay: 0 2px 6px rgba(0,0,0,.5), 0 18px 50px rgba(0,0,0,.6);
}
[data-density="compact"] { --type-body: 12px; }

.app { position: fixed; inset: 0; display: grid; grid-template-columns: 68px 1fr; background: var(--bg-canvas); overflow: hidden; }
.app[data-frame="win"] { font-family: "Segoe UI Variable Text", "Segoe UI", var(--font); }
.app[data-frame="linux"] { font-family: Cantarell, Inter, var(--font); }

/* 图标栏 */
.rail { background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; align-items: center; padding: 10px 0 12px; gap: 4px; position: relative; -webkit-app-region: drag; min-height: 0; }
.lights { display: flex; gap: 7px; height: 26px; align-items: center; margin-bottom: 6px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.app:not([data-frame="mac"]) .lights { display: none; }
.brand { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; margin: 2px 0 12px; box-shadow: var(--primary-shadow); flex: none; }
.app:not([data-frame="mac"]) .brand { margin-top: 6px; }
.rnav { display: flex; flex-direction: column; gap: 2px; align-items: center; width: 100%; }
.rbtn { appearance: none; border: 0; background: transparent; width: 56px; height: 54px; border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-secondary); font-size: 11px; font-weight: 500; cursor: pointer; position: relative; -webkit-app-region: no-drag; transition: background var(--motion-quick), color var(--motion-quick); padding: 0; }
.rbtn:hover { background: var(--surface-hover); color: var(--text-primary); }
.rbtn.on { background: var(--accent-tint); color: var(--accent); }
.rbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.rbtn .badge { position: absolute; top: 5px; right: 9px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--success); color: #fff; font-size: 10px; font-weight: 600; display: grid; place-items: center; padding: 0 4px; box-shadow: 0 0 0 2px var(--bg-sidebar); }
.rail .spacer { flex: 1; }
.ravatar { width: 34px; height: 34px; border-radius: 10px; overflow: hidden; cursor: pointer; box-shadow: inset 0 0 0 1px var(--border-subtle); margin-top: 6px; flex: none; -webkit-app-region: no-drag; transition: transform var(--motion-quick), box-shadow var(--motion-quick); }
.ravatar:hover { transform: scale(1.06); box-shadow: 0 0 0 2px var(--accent); }

/* 主区 */
.main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-canvas); -webkit-app-region: drag; z-index: 6; position: relative; }
.topbar .btn, .topbar .field, .topbar .running-pill { -webkit-app-region: no-drag; }
.tb-left { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.tb-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.tb-search { flex: 0 1 360px; min-width: 0; }
.topbar.plain .tb-search { visibility: hidden; }
.tb-right { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; }
.tb-actions { display: flex; align-items: center; gap: 2px; }
.running-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--surface-elevated); box-shadow: inset 0 0 0 1px var(--border-subtle); font-size: 12px; font-weight: 500; margin-right: 6px; cursor: pointer; border: 0; color: var(--text-primary); }
.running-pill:hover { background: var(--accent-tint); }
.wincontrols { display: none; gap: 2px; margin-left: 8px; }
.wincontrols i { width: 40px; height: 30px; display: grid; place-items: center; color: inherit; border-radius: 4px; font-size: 11px; }
.wincontrols i:last-child:hover { background: #c42b1c; color: #fff; }
.app[data-frame="win"] .wincontrols { display: flex; }
.gnome { display: none; margin-left: 8px; }
.gnome i { width: 24px; height: 24px; border-radius: 50%; background: rgba(128,128,128,.25); display: grid; place-items: center; font-size: 11px; }
.app[data-frame="linux"] .gnome { display: flex; }
.import-status { width: 210px; display: grid; gap: 5px; font-size: 11px; color: var(--text-secondary); margin-right: 10px; -webkit-app-region: no-drag; }
.import-status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scroll { flex: 1; overflow: auto; min-height: 0; position: relative; }
.page { padding: 20px 28px 48px; }

/* 区块 */
.section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.section-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
.section-head small { color: var(--text-tertiary); }
.section-head .btn { margin-left: auto; }
.section-head .btn + .btn { margin-left: 0; }

/* 正在运行 */
.runstrip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
.runcard { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: var(--radius-md); background: var(--surface-default); box-shadow: inset 0 0 0 1px var(--border-subtle); min-width: 250px; flex: none; }
.runcard .thumb { width: 40px; height: 40px; border-radius: 9px; background-size: cover; image-rendering: pixelated; flex: none; }
.runcard .texts { flex: 1; min-width: 0; line-height: 1.25; }
.runcard b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.runcard small { color: var(--success); font-size: 11px; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 5px; }

/* 继续游戏 */
.hero { position: relative; height: 200px; border-radius: var(--radius-xl); background-size: cover; background-position: center; image-rendering: pixelated; overflow: hidden; display: flex; align-items: flex-end; gap: 16px; padding: 22px 24px; box-shadow: var(--elev-raised); color: #fff; margin-top: 20px; }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.74) 0%, rgba(0,0,0,.42) 50%, rgba(0,0,0,.12) 100%), linear-gradient(0deg, rgba(0,0,0,.45), transparent 65%); }
.hero > * { position: relative; z-index: 1; }
.hero .hero-text { flex: 1; min-width: 0; }
.hero .kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .78; font-weight: 600; }
.hero .hname { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 10px; line-height: 1.1; }
.hero .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hero .chips .tag { background: rgba(255,255,255,.16); color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.hero .chips .tag svg { color: rgba(255,255,255,.8); }
.hero .chips .tag.success { background: color-mix(in srgb, var(--success) 70%, transparent); }
.hero .chips .tag.danger { background: color-mix(in srgb, var(--danger) 70%, transparent); }
.hero .hero-act { display: flex; gap: 8px; align-items: center; }
.hero .hero-act .btn.icon { width: 44px; height: 48px; border-radius: var(--radius-lg); background: rgba(255,255,255,.14); color: #fff; backdrop-filter: blur(6px); }
.hero .hero-act .btn.icon:hover { background: rgba(255,255,255,.26); }
.hero .btn.stopping { background: rgba(255,255,255,.92); color: #17181A; }

/* 实例卡 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.card { background: var(--surface-default); border-radius: var(--radius-lg); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border-subtle); cursor: pointer; position: relative; transition: transform var(--motion-quick), box-shadow var(--motion-quick); user-select: none; }
.card:hover { transform: translateY(-2px); box-shadow: var(--elev-raised), inset 0 0 0 1px var(--border-subtle); }
.card .cover { aspect-ratio: 16 / 9; background-size: cover; background-position: center; image-rendering: pixelated; position: relative; }
.card .playov { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.85); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.94); color: #17181A; display: grid; place-items: center; opacity: 0; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.3); transition: opacity var(--motion-quick), transform var(--motion-quick), background var(--motion-quick); }
.card:hover .playov { opacity: 1; transform: translate(-50%, -50%); }
.card .playov:hover { background: #fff; transform: translate(-50%, -50%) scale(1.06); }
.card.running .playov { background: rgba(23,24,26,.85); color: #fff; }
.card.busy .playov { display: none; }
.card .fav { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 8px; background: rgba(0,0,0,.35); color: #fff; display: grid; place-items: center; backdrop-filter: blur(6px); cursor: pointer; opacity: 0; transition: opacity var(--motion-quick); }
.card:hover .fav, .card .fav.on { opacity: 1; }
.card .fav.on { color: #F7C948; }
.card .status { position: absolute; left: 8px; bottom: 8px; display: flex; }
.card .status .tag { background: rgba(0,0,0,.45); color: #fff; backdrop-filter: blur(6px); }
.card .status .tag.success { background: color-mix(in srgb, var(--success) 85%, black); }
.card .status .tag.danger { background: color-mix(in srgb, var(--danger) 85%, black); }
.card .status .spinner { width: 10px; height: 10px; border-color: rgba(255,255,255,.35); border-top-color: #fff; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
.card .body b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .body small { color: var(--text-secondary); font-size: 11px; }
.card .body .meta { display: flex; justify-content: space-between; align-items: center; color: var(--text-tertiary); font-size: 11px; margin-top: 4px; }
.card .body .meta span { display: inline-flex; align-items: center; gap: 4px; }
.card.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-tertiary); border: 1.5px dashed var(--border-strong); background: transparent; box-shadow: none; min-height: 170px; font-weight: 500; }
.card.add:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-tint); transform: none; box-shadow: none; }
.gempty-grid { grid-column: 1 / -1; padding: 40px; text-align: center; color: var(--text-tertiary); }
.listbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 28px; padding: 0 12px; border-radius: 999px; background: var(--surface-default); box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--text-secondary); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: 0; transition: all var(--motion-quick); }
.chip.on, .chip:hover { background: var(--accent-tint); color: var(--accent); box-shadow: none; }

/* 整合包卡 */
.packs-head { padding: 20px 28px 0; }
.packs-head h1 { margin: 0 0 4px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.packs-head p { margin: 0 0 16px; color: var(--text-secondary); }
.packgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; padding: 18px 28px 48px; }
.packgrid.home { padding: 0; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pack { background: var(--surface-default); border-radius: var(--radius-lg); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border-subtle); transition: transform var(--motion-quick), box-shadow var(--motion-quick); display: flex; flex-direction: column; }
.pack:hover { transform: translateY(-2px); box-shadow: var(--elev-raised), inset 0 0 0 1px var(--border-subtle); }
.pack .cover { height: 110px; background-size: cover; background-position: center; image-rendering: pixelated; position: relative; }
.pack .cover .tags { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 4px; }
.pack .cover .tag { background: rgba(0,0,0,.45); color: #fff; backdrop-filter: blur(6px); }
.pack .body { padding: 12px 14px 14px; display: flex; flex-direction: column; flex: 1; }
.pack .body b { font-size: 14px; display: block; }
.pack .body small { color: var(--text-secondary); display: block; margin-top: 2px; }
.pack .body p { margin: 8px 0 12px; color: var(--text-secondary); font-size: 12px; min-height: 34px; flex: 1; }
.pack .body .row { display: flex; align-items: center; gap: 6px; }
.pack .body .row .btn { margin-left: auto; }

/* 实例页 */
.ihead { position: sticky; top: 0; z-index: 4; background: var(--bg-canvas); padding: 16px 28px 0; }
.ihead .row { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; }
.ihead .art { width: 56px; height: 56px; border-radius: 14px; background-size: cover; image-rendering: pixelated; box-shadow: inset 0 0 0 1px var(--border-subtle); flex: none; }
.ihead .texts { flex: 1; min-width: 0; }
.ihead .name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; line-height: 1.2; }
.ihead .name .fav { color: var(--warning); cursor: pointer; display: inline-flex; }
.ihead .chips { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.ihead .chips .tag svg { color: var(--text-tertiary); }
.ihead .actions { display: flex; gap: 8px; align-items: center; }
.ihead .actions .btn.icon { height: 40px; width: 40px; background: var(--surface-default); box-shadow: inset 0 0 0 1px var(--border-subtle); border-radius: var(--radius-lg); color: var(--text-primary); }
.ibody { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; padding: 20px 28px 48px; align-items: start; }
.imain { min-width: 0; position: relative; }
.imain > .pane { display: flex; flex-direction: column; }
.iside { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--surface-default); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--border-subtle); padding: 14px 16px; }
.panel h4 { margin: 0 0 10px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; min-height: 20px; }
.panel h4 .btn, .panel h4 .tag { margin-left: auto; }
.panel p { margin: 0; color: var(--text-secondary); font-size: 12px; line-height: 1.6; }
.panel .bignum { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.panel .bignum em { font-style: normal; font-size: 13px; color: var(--text-tertiary); font-weight: 500; margin-left: 4px; }
.panel .btnrow { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.panel .btnrow .btn { flex: 1; }
.panel.danger-panel { background: var(--danger-tint); box-shadow: none; }
.plist { display: flex; flex-direction: column; }
.prow2 { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border-subtle); }
.prow2:first-child { border-top: 0; }
.prow2 .thumb { width: 30px; height: 30px; border-radius: 7px; background-size: cover; image-rendering: pixelated; flex: none; }
.prow2 .texts { flex: 1; min-width: 0; line-height: 1.25; }
.prow2 b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow2 small { color: var(--text-secondary); font-size: 11px; }
.prow2 .btn.icon { opacity: 0; } .prow2:hover .btn.icon { opacity: 1; }
.prow2.clickable { cursor: pointer; margin: 0 -6px; padding-left: 6px; padding-right: 6px; border-radius: 8px; }
.prow2.clickable:hover { background: var(--surface-hover); }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border-subtle); font-size: 12px; }
.kv:first-of-type { border-top: 0; }
.kv span { color: var(--text-secondary); } .kv b { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.qa { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; }
.qa button { appearance: none; border: 0; background: transparent; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border-radius: 8px; color: var(--text-primary); cursor: pointer; text-align: left; width: 100%; font-weight: 500; }
.qa button:hover { background: var(--surface-hover); }
.qa button svg { color: var(--accent); flex: none; }
.qa button small { margin-left: auto; color: var(--text-tertiary); font-size: 11px; font-weight: 400; }

/* 概览 */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface-default); border-radius: var(--radius-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 0 0 1px var(--border-subtle); min-width: 0; }
.stat small { color: var(--text-secondary); display: flex; align-items: center; gap: 6px; font-size: 12px; }
.stat b { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b em { font-style: normal; font-size: 12px; color: var(--text-tertiary); font-weight: 500; margin-left: 4px; }
.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.world { background: var(--surface-default); border-radius: var(--radius-lg); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border-subtle); transition: transform var(--motion-quick), box-shadow var(--motion-quick); cursor: pointer; }
.world:hover { transform: translateY(-2px); box-shadow: var(--elev-raised), inset 0 0 0 1px var(--border-subtle); }
.world .cover { height: 84px; background-size: cover; background-position: center; image-rendering: pixelated; }
.world .body { padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
.world .body > div { min-width: 0; }
.world .body b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.world .body small { color: var(--text-secondary); font-size: 11px; }
.world .body .btn { margin-left: auto; }
.world.add { display: grid; place-items: center; min-height: 140px; color: var(--text-tertiary); border: 1.5px dashed var(--border-strong); background: transparent; box-shadow: none; }
.notice { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius-lg); background: var(--danger-tint); color: var(--text-primary); margin-bottom: 18px; flex-wrap: wrap; }
.notice svg { color: var(--danger); flex: none; }
.notice .texts { flex: 1; min-width: 200px; } .notice b { display: block; } .notice small { color: var(--text-secondary); }
.activity { display: flex; flex-direction: column; }
.activity .item { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border-subtle); align-items: flex-start; font-size: 12px; line-height: 1.4; }
.activity .item:first-child { border: 0; }
.activity .item svg { color: var(--text-tertiary); flex: none; margin-top: 1px; }
.activity .item span { flex: 1; }
.activity .item small { color: var(--text-tertiary); white-space: nowrap; }

/* 模组 */
.modbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.modbar .field { flex: 1; min-width: 160px; max-width: 320px; }
.modlist { display: flex; flex-direction: column; gap: 4px; }
.mrow { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border-radius: var(--radius-md); background: var(--surface-default); box-shadow: inset 0 0 0 1px var(--border-subtle); }
.mrow .mi { width: 28px; height: 28px; border-radius: 7px; background: var(--accent-tint); color: var(--accent); display: grid; place-items: center; flex: none; }
.mrow .texts { flex: 1; min-width: 0; line-height: 1.25; } .mrow .texts b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .mrow .texts small { color: var(--text-secondary); font-size: 11px; }
.mrow .tag { margin-right: 4px; }
.mrow .btn.icon { opacity: 0; } .mrow:hover .btn.icon { opacity: 1; }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.group { background: var(--surface-default); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--border-subtle); overflow: hidden; }
.group .ghead { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); font-weight: 600; }
.group .ghead .btn { margin-left: auto; }
.group .gempty { padding: 28px; text-align: center; color: var(--text-tertiary); }
.group .mrow { box-shadow: none; border-radius: 0; border-bottom: 1px solid var(--border-subtle); }
.group .mrow:last-child { border-bottom: 0; }

/* 日志 */
.console { background: #101112; color: #d5d7da; border-radius: var(--radius-lg); padding: 16px 18px; font: 12px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; max-height: 460px; overflow: auto; white-space: pre; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.console .i { color: #8fa9c6; } .console .w { color: #e0a94a; } .console .e { color: #e26b61; }
.logbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }

/* 账号页 */
.accgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.acc { background: var(--surface-default); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--border-subtle); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-height: 196px; transition: transform var(--motion-quick), box-shadow var(--motion-quick); }
.acc.on { box-shadow: inset 0 0 0 2px var(--accent); }
.acc .top { display: flex; align-items: center; gap: 14px; }
.acc .avatar { width: 64px; height: 64px; border-radius: 16px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border-subtle); flex: none; }
.acc .texts { min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.acc .texts b { font-size: 17px; font-weight: 600; }
.acc .texts small { color: var(--text-secondary); }
.acc .uuid { font: 11px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--text-tertiary); word-break: break-all; background: var(--surface-sunken); padding: 6px 8px; border-radius: 8px; }
.acc .acts { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
.acc.add, .acc.soon { align-items: center; justify-content: center; text-align: center; gap: 6px; color: var(--text-tertiary); border: 1.5px dashed var(--border-strong); background: transparent; box-shadow: none; }
.acc.add { cursor: pointer; font-weight: 500; }
.acc.add:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-tint); }
.acc.add small, .acc.soon small { font-weight: 400; font-size: 12px; }
.acc.soon b { color: var(--text-secondary); font-weight: 600; }

/* 设置页 */
.settings { display: grid; grid-template-columns: 196px 1fr; min-height: 100%; }
.settings nav { padding: 18px 12px 16px; border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 2px; background: color-mix(in srgb, var(--bg-sidebar) 50%, var(--bg-canvas)); }
.settings nav button { appearance: none; border: 0; background: transparent; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer; font-weight: 500; transition: background var(--motion-quick), color var(--motion-quick); text-align: left; }
.settings nav button svg { color: var(--text-tertiary); }
.settings nav button:hover { background: var(--surface-hover); color: var(--text-primary); }
.settings nav button.on { background: var(--accent-tint); color: var(--accent); } .settings nav button.on svg { color: var(--accent); }
.settings .content { padding: 22px 36px 48px; overflow: auto; min-width: 0; }
.settings .content h2 { margin: 0 0 16px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }

/* 欢迎页与空状态 */
.welcome { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 32px; text-align: center; gap: 26px; position: relative; overflow: hidden; }
.welcome .collage { display: flex; gap: 10px; }
.welcome .collage i { width: 120px; height: 76px; border-radius: 14px; background-size: cover; image-rendering: pixelated; box-shadow: var(--elev-raised); transform: rotate(var(--r)); display: block; animation: rowIn var(--motion-emphasized) both; }
.welcome h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
.welcome p { margin: 0; color: var(--text-secondary); max-width: 440px; font-size: 15px; }
.stepper { display: flex; align-items: center; gap: 8px; color: var(--text-tertiary); font-size: 12px; font-weight: 500; }
.stepper .s { display: inline-flex; align-items: center; gap: 6px; }
.stepper .s i { width: 20px; height: 20px; border-radius: 50%; background: var(--surface-sunken); color: var(--text-secondary); display: grid; place-items: center; font-size: 11px; font-style: normal; }
.stepper .s.done i { background: var(--success); color: #fff; }
.stepper .s.cur { color: var(--text-primary); } .stepper .s.cur i { background: var(--accent); color: #fff; }
.stepper .line { width: 36px; height: 1px; background: var(--border-strong); }
.steps { display: grid; grid-template-columns: repeat(3, 220px); gap: 12px; }
.step { background: var(--surface-default); border-radius: var(--radius-lg); padding: 18px; text-align: left; box-shadow: inset 0 0 0 1px var(--border-subtle); display: flex; flex-direction: column; gap: 8px; }
.step .n { width: 26px; height: 26px; border-radius: 8px; background: var(--accent-tint); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; }
.step b { font-size: 14px; } .step small { color: var(--text-secondary); }
.step.done .n { background: var(--success); color: #fff; }
.empty { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 40px; }
.empty .art { width: 96px; height: 96px; border-radius: 24px; background: var(--surface-sunken); display: grid; place-items: center; color: var(--text-tertiary); }
.empty h2 { margin: 0; font-size: 22px; font-weight: 700; } .empty p { margin: 0; color: var(--text-secondary); max-width: 380px; }
.empty .hint { color: var(--text-tertiary); font-size: 12px; }

/* 账号弹层（图标栏头像） */
.popover { position: absolute; left: 76px; bottom: 12px; z-index: 60; width: 248px; background: var(--surface-elevated); border-radius: var(--radius-lg); box-shadow: var(--elev-overlay), inset 0 0 0 1px var(--border-subtle); padding: 6px; transform-origin: bottom left; animation: menuIn var(--motion-standard) both; }
.popover .prow { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-md); cursor: pointer; }
.popover .prow:hover { background: var(--surface-hover); }
.popover .prow .avatar { width: 32px; height: 32px; border-radius: 8px; overflow: hidden; }
.popover .prow .texts { flex: 1; line-height: 1.2; } .popover .prow small { color: var(--text-secondary); font-size: 11px; }
.popover hr { border: 0; border-top: 1px solid var(--border-subtle); margin: 4px 8px; }

/* 运行中弹层 */
.runpop { position: absolute; top: 48px; right: 12px; z-index: 60; width: 300px; background: var(--surface-elevated); border-radius: var(--radius-lg); box-shadow: var(--elev-overlay), inset 0 0 0 1px var(--border-subtle); padding: 6px; animation: menuIn var(--motion-standard) both; transform-origin: top right; }
.runpop .prow { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-md); }
.runpop .prow:hover { background: var(--surface-hover); }
.runpop .thumb { width: 32px; height: 32px; border-radius: 8px; background-size: cover; image-rendering: pixelated; }
.runpop .texts { flex: 1; line-height: 1.2; min-width: 0; } .runpop .texts small { color: var(--success); font-size: 11px; font-variant-numeric: tabular-nums; }
.runpop .head { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); letter-spacing: .05em; }

/* Sheet 调整 */
.sheet { width: 500px; }
.sheet .segmented button { padding: 0 10px; }
.sheet.confirm { width: 380px; }
</style>
</head>
<body>
<div class="app" id="app" data-frame="mac">
  <nav class="rail" id="rail">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="brand" title="Yumu"><span data-icon="cube" data-size="22"></span></div>
    <div class="rnav" id="railNav"></div>
    <div class="spacer"></div>
    <button class="rbtn" id="railSettings" title="设置"><span data-icon="gear" data-size="20"></span><span>设置</span></button>
    <div class="ravatar" id="railAvatar" title="账号"></div>
  </nav>
  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <div class="tb-left" id="tbLeft"></div>
      <div class="tb-search"><div class="field"><span data-icon="search"></span><input id="tbSearch" placeholder="搜索实例…"></div></div>
      <div class="tb-right">
        <div id="importSlot"></div>
        <div class="tb-actions" id="tbActions"></div>
        <div class="wincontrols"><i>&#x2500;</i><i>&#x25A1;</i><i>&#x2715;</i></div><div class="gnome"><i>&#x2715;</i></div>
      </div>
    </header>
    <div class="scroll" id="scroll"></div>
    <div id="overlays"></div>
  </main>
</div>
<script src="shared.js?v=3"></script>
<script>
const state = { selected: 'survival', tab: 'overview', activity: {}, running: {}, crash: null, importing: null, settingsSection: 'general', welcomeDone: true, query: '', sort: 'recent', loaderFilter: 'all', lastId: 'survival', backTo: '/' };
const instances = DATA.instances;
const current = () => instances.find(i => i.id === state.selected);
const app = $('#app'), main = $('#main'), overlays = $('#overlays'), scroll = $('#scroll');
const route = () => (location.hash || '#/').slice(1).split('/').filter(Boolean);
const activePane = () => scroll.querySelector('.pane:not(.out)');

function elapsed(id) { const s = Math.floor((Date.now() - state.running[id]) / 1000); const m = Math.floor(s / 60), h = Math.floor(m / 60); return h ? `${h} 小时 ${m % 60} 分` : `${m} 分 ${String(s % 60).padStart(2, '0')} 秒`; }
setInterval(() => {
  if (!Object.keys(state.running).length) return;
  $$('[data-elapsed]').forEach(s => { if (state.running[s.dataset.elapsed]) s.textContent = (s.dataset.prefix || '') + elapsed(s.dataset.elapsed); });
}, 1000);

/* ---------- 图标栏 ---------- */
const NAV = [['', 'home', '首页'], ['instances', 'grid', '实例'], ['packs', 'package', '整合包'], ['accounts', 'users', '账号']];
function renderRail() {
  const p = route()[0] || ''; const n = Object.keys(state.running).length;
  const active = p === 'instance' ? 'instances' : p;
  $('#railNav').innerHTML = NAV.map(([k, ic, label]) => `<button class="rbtn ${active === k ? 'on' : ''}" data-nav="${k}" title="${label}">${icon(ic, 20)}<span>${label}</span>${k === '' && n ? `<span class="badge">${n}</span>` : ''}</button>`).join('');
  $$('[data-nav]', $('#railNav')).forEach(b => b.onclick = () => go('/' + b.dataset.nav));
  $('#railSettings').classList.toggle('on', p === 'settings');
  const acc = DATA.accounts.find(a => a.active) || DATA.accounts[0];
  $('#railAvatar').innerHTML = acc ? face(acc.id, 34) : icon('user', 18);
  $('#railAvatar').title = acc ? `${acc.name} · ${acc.kind}` : '账号';
}

/* ---------- 顶栏 ---------- */
const TITLES = { '': '首页', instances: '实例', packs: '整合包', accounts: '账号', settings: '设置', welcome: '欢迎' };
function renderToolbar() {
  const [p] = route(); const n = Object.keys(state.running).length;
  const left = $('#tbLeft');
  if (p === 'instance' && current()) left.innerHTML = `<button class="btn icon" id="tbBack" title="返回">${icon('back', 18)}</button><span class="tb-title">${current().name}</span>`;
  else left.innerHTML = `<span class="tb-title">${TITLES[p || ''] || 'Yumu'}</span>`;
  const back = $('#tbBack'); if (back) back.onclick = () => go(state.backTo || '/');
  $('#topbar').classList.toggle('plain', p === 'welcome');
  $('#tbActions').innerHTML = `${n ? `<button class="running-pill" id="runPill"><span class="dot success breathe"></span>${n} 个实例运行中</button>` : ''}
    <button class="btn icon" title="导入整合包" id="tbImport">${icon('import')}</button>
    <button class="btn icon" title="新建实例" id="tbNew">${icon('plus')}</button>`;
  $('#tbImport').onclick = simulateDrop; $('#tbNew').onclick = () => openNew();
  const pill = $('#runPill'); if (pill) pill.onclick = () => {
    if ($('.runpop', overlays)) { $('.runpop', overlays).remove(); return; }
    const p = el(`<div class="runpop"><div class="head">正在运行</div>${Object.keys(state.running).map(id => { const i = instances.find(x => x.id === id); return `<div class="prow"><div class="thumb" style="background-image:${cover(i.id, i.biome, 8, 8)}"></div><div class="texts"><div>${i.name}</div><small><span data-elapsed="${id}" data-prefix="运行中 · ">运行中 · ${elapsed(id)}</span></small></div><button class="btn quiet" data-go="${id}">查看</button><button class="btn icon" data-stop="${id}" title="结束游戏">${icon('stop', 14)}</button></div>`; }).join('')}</div>`);
    overlays.appendChild(p);
    $$('[data-go]', p).forEach(b => b.onclick = () => { p.remove(); go('/instance/' + b.dataset.go); });
    $$('[data-stop]', p).forEach(b => b.onclick = () => { p.remove(); stop(b.dataset.stop); });
    setTimeout(() => document.addEventListener('pointerdown', function h(e) { if (!p.contains(e.target) && e.target !== pill && !pill.contains(e.target)) { p.remove(); document.removeEventListener('pointerdown', h); } }), 0);
  };
}
$('#tbSearch').oninput = e => { state.query = e.target.value; const [r] = route(); if (!r || r === 'instances') renderGrid($('#grid', activePane() || scroll)); else if (state.query.trim()) go('/instances'); };

/* ---------- 页面挂载 ---------- */
function mount(html, cls = '') {
  const old = scroll.firstElementChild;
  if (old) { old.classList.add('out'); setTimeout(() => old.remove(), 320); }
  const page = el(`<div class="pane ${cls}" style="min-height:100%">${html}</div>`);
  scroll.appendChild(page); scroll.scrollTop = 0; hydrateIcons(page); bindSwitches(page);
  return page;
}

/* ---------- 实例卡与网格 ---------- */
function sortList(list) {
  if (state.sort === 'name') return [...list].sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN'));
  if (state.sort === 'time') return [...list].sort((a, b) => b.hours - a.hours);
  return [...list].sort((a, b) => (a.id === state.lastId ? -1 : 0) - (b.id === state.lastId ? -1 : 0));
}
function filtered() { const q = state.query.trim().toLowerCase(); return instances.filter(i => (!q || i.name.toLowerCase().includes(q)) && (state.loaderFilter === 'all' || (i.loader || '原版') === state.loaderFilter)); }
function instCard(ins) {
  const act = state.activity[ins.id], running = state.running[ins.id];
  const status = running ? `<span class="tag success"><span class="dot success breathe" style="background:#fff"></span><span data-elapsed="${ins.id}" data-prefix="">${elapsed(ins.id)}</span></span>`
    : act ? `<span class="tag"><span class="spinner"></span>${act === 'preparing' ? '准备中…' : '正在安装…'}</span>`
    : state.crash === ins.id ? `<span class="tag danger">${icon('warning', 11)}上次崩溃</span>` : '';
  return `<div class="card ${act ? 'busy' : ''} ${running ? 'running' : ''}" data-id="${ins.id}">
    <div class="cover" style="background-image:${cover(ins.id, ins.biome, 32, 18)}">
      <button class="playov" data-play title="${running ? '结束游戏' : '开始游戏'}">${icon(running ? 'stop' : 'play', 22)}</button>
      <span class="fav ${ins.favorite ? 'on' : ''}" data-fav title="${ins.favorite ? '取消收藏' : '收藏'}">${icon(ins.favorite ? 'starFill' : 'star', 14)}</span>
      <div class="status">${status}</div>
    </div>
    <div class="body"><b>${ins.name}</b><small>${ins.loader ? `${ins.loader} · ${ins.version}` : `原版 · ${ins.version}`}</small><div class="meta"><span>${icon('clock', 11)}${ins.playtime}</span><span>${ins.lastPlayed}</span></div></div>
  </div>`;
}
function renderGrid(grid, opts = {}) {
  if (!grid) return;
  const list = sortList(filtered()); const filtering = state.query.trim() || state.loaderFilter !== 'all';
  grid.innerHTML = list.map(i => instCard(i)).join('') + (filtering ? (list.length ? '' : `<div class="gempty-grid">没有匹配的实例</div>`) : `<div class="card add" id="addCard">${icon('plus', 22)}<span>新建实例</span></div>`);
  bindCards(grid);
  const add = $('#addCard', grid); if (add) add.onclick = () => openNew();
  if (opts.enter) { const c = $(`.card[data-id="${opts.enter}"]`, grid); c && c.classList.add('enter', 'pop'); }
  const cnt = $('#gridCount'); if (cnt) cnt.textContent = `${list.length} 个实例`;
}
function bindCards(root) {
  $$('.card[data-id]', root).forEach(c => {
    const ins = instances.find(i => i.id === c.dataset.id); if (!ins) return;
    c.onclick = e => { if (e.target.closest('[data-play],[data-fav]')) return; state.tab = 'overview'; go('/instance/' + ins.id); };
    c.oncontextmenu = e => { e.preventDefault(); contextMenu(e, ins); };
    $('[data-play]', c).onclick = () => state.running[ins.id] ? stop(ins.id) : play(ins.id);
    $('[data-fav]', c).onclick = () => { ins.favorite = !ins.favorite; refresh(); };
  });
}
function packCard(p, i) { return `<div class="pack"><div class="cover" style="background-image:${cover(p.name, p.biome, 40, 14)}"><div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div></div><div class="body"><b>${p.name}</b><small>${p.by} · ${p.dl} 次下载</small><p>${p.desc}</p><div class="row"><span class="tag">${p.loader}</span><span class="tag">${p.version}</span><button class="btn primary" data-install="${i}">安装</button></div></div></div>`; }
function bindPacks(root) { $$('[data-install]', root).forEach(b => b.onclick = () => importPack(DATA.packs[b.dataset.install])); }

/* ---------- 首页 ---------- */
function renderHome() {
  renderToolbar();
  const page = mount(`<div class="page">
    <div class="section" id="runSection" style="margin-top:0;display:none"></div>
    <div id="heroWrap"></div>
    <div class="section"><div class="section-head"><h3>我的实例</h3><small id="gridCount"></small><button class="btn quiet" data-go="/instances">全部 ${icon('chevron', 12)}</button></div><div class="grid" id="grid"></div></div>
    <div class="section"><div class="section-head"><h3>推荐整合包</h3><small>安装会新建一个实例</small><button class="btn quiet" data-go="/packs">浏览全部 ${icon('chevron', 12)}</button></div>
      <div class="packgrid home">${DATA.packs.slice(0, 3).map((p, i) => packCard(p, i)).join('')}</div></div>
  </div>`);
  renderRunStrip(page); renderHero(page); renderGrid($('#grid', page));
  bindPacks(page); $$('[data-go]', page).forEach(b => b.onclick = () => go(b.dataset.go));
}
function renderRunStrip(page) {
  const sec = $('#runSection', page); if (!sec) return;
  const ids = Object.keys(state.running);
  sec.style.display = ids.length ? '' : 'none';
  sec.innerHTML = ids.length ? `<div class="section-head"><h3>正在运行</h3><small>${ids.length} 个</small></div><div class="runstrip">${ids.map(id => { const i = instances.find(x => x.id === id); return `<div class="runcard enter" data-id="${id}"><div class="thumb" style="background-image:${cover(i.id, i.biome, 8, 8)}"></div><div class="texts"><b>${i.name}</b><small><span class="dot success breathe"></span><span data-elapsed="${id}" data-prefix="已运行 ">已运行 ${elapsed(id)}</span></small></div><button class="btn quiet" data-go-ins="${id}">查看</button><button class="btn" data-stop="${id}">${icon('stop', 13)}结束</button></div>`; }).join('')}</div>` : '';
  $$('[data-go-ins]', sec).forEach(b => b.onclick = () => go('/instance/' + b.dataset.goIns));
  $$('[data-stop]', sec).forEach(b => b.onclick = () => stop(b.dataset.stop));
}
function heroTarget() { return instances.find(i => i.id === state.lastId) || instances[0]; }
function renderHero(page) {
  const wrap = $('#heroWrap', page); if (!wrap) return; const ins = heroTarget(); if (!ins) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<div class="hero" style="background-image:${cover(ins.id, ins.biome, 48, 16)}" data-id="${ins.id}">
    <div class="hero-text"><div class="kicker">${state.running[ins.id] ? '正在运行' : '继续游戏'}</div><div class="hname">${ins.name}</div>
      <div class="chips"><span class="tag">${icon(ins.loader ? 'puzzle' : 'cube', 12)}${ins.loader ? `${ins.loader} ${ins.loaderVersion}` : '原版'}</span><span class="tag">${icon('tag', 12)}${ins.version}</span>${ins.mods.length ? `<span class="tag">${icon('layers', 12)}${ins.mods.length} 个模组</span>` : ''}<span class="tag">${icon('clock', 12)}${ins.playtime}</span><span class="tag">${icon('calendar', 12)}${ins.lastPlayed}</span><span id="heroStatus"></span></div></div>
    <div class="hero-act"><span id="heroAction"></span><button class="btn icon" id="heroOpen" title="打开实例">${icon('arrowRight', 18)}</button></div></div>`;
  renderPlayStatus(page, ins, 'xl');
  $('#heroOpen', wrap).onclick = () => { state.tab = 'overview'; go('/instance/' + ins.id); };
  $('.hero', wrap).oncontextmenu = e => { e.preventDefault(); contextMenu(e, ins); };
}
function renderPlayStatus(page, ins, size = 'xl') {
  const act = state.activity[ins.id], running = state.running[ins.id];
  const st = $('#heroStatus', page), ac = $('#heroAction', page); if (!st || !ac) return;
  st.innerHTML = running ? `<span class="tag success"><span class="dot success breathe"></span>运行中 · <span data-elapsed="${ins.id}" data-prefix="">${elapsed(ins.id)}</span></span>`
    : act === 'installing' ? `<span class="tag"><span class="spinner" style="width:10px;height:10px"></span><span class="instNum">正在安装…</span></span>`

    ${panel('自动备份', `<div class="srow" style="padding:0;min-height:0;border:0"><div class="stexts"><b>退出游戏后备份</b><small>保留最近 5 份。</small></div><div class="scontrol"><button class="switch" aria-checked="true"></button></div></div>`)}`;
  else if (t === 'logs') html = `
    ${panel('运行信息', `<div class="kv"><span>Java</span><b>${DATA.javas[0].name}</b></div><div class="kv"><span>内存</span><b>${state.crash === ins.id ? '2 GB' : '4 GB'}</b></div><div class="kv"><span>游戏</span><b>${ins.version}</b></div><div class="kv"><span>加载器</span><b>${ins.loader ? `${ins.loader} ${ins.loaderVersion}` : '原版'}</b></div><div class="kv"><span>上次运行</span><b>${ins.lastPlayed}</b></div>`)}
    ${state.crash === ins.id ? panel('崩溃原因', `<p><b style="color:var(--text-primary)">OutOfMemoryError</b><br>Java 堆内存不足。把内存调到 4 GB 通常能解决。</p><div class="btnrow"><button class="btn primary">把内存调到 4 GB</button></div>`, 'danger-panel') : ''}
    ${panel('操作', `<div class="qa"><button>${icon('copy', 16)}复制日志</button><button>${icon('external', 16)}上传并分享链接</button><button>${icon('folder', 16)}打开日志目录</button></div>`)}`;
  else if (t === 'settings') html = `
    ${panel('提示', `<p>设置修改会立即保存，在下次开始游戏时生效。留空的项使用全局设置。</p>`)}
    ${panel('更多操作', `<div class="qa"><button>${icon('folder', 16)}打开文件夹</button><button>${icon('package', 16)}导出为 .mrpack…</button><button data-dup>${icon('copy', 16)}复制实例</button><button data-rename>${icon('pen', 16)}重命名…</button></div>`)}`;
  side.innerHTML = html; hydrateIcons(side); bindSwitches(side);
  $$('[data-tab-go]', side).forEach(b => b.onclick = () => { const i = TABS.findIndex(t => t[0] === b.dataset.tabGo); $$('#tabs button', page)[i].click(); });
  $$('[data-world-go]', side).forEach(r => r.onclick = () => !state.running[ins.id] && play(ins.id));
  $$('[data-dup]', side).forEach(b => b.onclick = () => duplicate(ins));
  $$('[data-rename]', side).forEach(b => b.onclick = () => rename(ins));
  const sf = $('#sideFabric', side); if (sf) sf.onclick = () => openNew('Fabric');
}
function worldCard(ins, w) { return `<div class="world" data-world="${w.name}"><div class="cover" style="background-image:${cover(ins.id + w.name, ins.biome, 24, 8)}"></div><div class="body"><div><b>${w.name}</b><small>${w.mode} · ${w.size} · ${w.last}</small></div><button class="btn icon" title="进入世界">${icon('play')}</button></div></div>`; }

/* ---------- 整合包页 ---------- */
function renderPacks() {
  renderToolbar();

    <div class="field large" style="max-width:520px;margin-bottom:14px">${icon('search')}<input placeholder="搜索 Modrinth 整合包…"></div>
    <div class="chips"><button class="chip on">全部</button><button class="chip">优化</button><button class="chip">冒险</button><button class="chip">科技</button><button class="chip">魔法</button><button class="chip">空岛</button><button class="chip">原版+</button><span style="flex:1"></span><button class="chip">${icon('sliders', 13)}版本与加载器</button></div></div>

/* ---------- 账号页 ---------- */
function renderAccounts() {
  renderToolbar();
  const page = mount(`<div class="page">
    <div class="section-head" style="margin-bottom:14px"><h3>账号</h3><small>切换后，新启动的游戏使用该账号。</small><button class="btn primary" id="accMs">${icon('plus')}用微软账号登录</button><button class="btn" id="accOff">添加离线账号</button></div>
    <div class="accgrid">
      ${DATA.accounts.map(a => `<div class="acc ${a.active ? 'on' : ''}" data-acc="${a.id}">
        <div class="top"><div class="avatar">${face(a.id, 64)}</div><div class="texts"><b>${a.name}</b><small>${a.kind}账号${a.active ? ' · 当前使用' : ''}</small>${a.active ? '<span class="tag accent">当前</span>' : ''}</div></div>
        <div class="uuid">UUID ${a.uuid}</div>
        <div class="acts">${a.active ? `<button class="btn">${icon('skin', 14)}皮肤…</button>` : `<button class="btn primary" data-switch="${a.id}">切换</button>`}<button class="btn">${icon('refresh', 14)}刷新</button><button class="btn quiet" data-remove="${a.id}">移除</button></div>
      </div>`).join('')}
      <div class="acc add" id="accAdd">${icon('plus', 24)}<span>添加账号</span><small>微软账号或离线账号</small></div>
      <div class="acc soon">${icon('skin', 28)}<b>皮肤与披风预览</b><small>即将推出</small></div>
    </div></div>`);
  $$('[data-switch]', page).forEach(b => b.onclick = () => { DATA.accounts.forEach(a => a.active = a.id === b.dataset.switch); renderAccounts(); renderRail(); toast(overlays, `已切换到 ${DATA.accounts.find(a => a.active).name}`); });
  $$('[data-remove]', page).forEach(b => b.onclick = () => {
    const a = DATA.accounts.find(x => x.id === b.dataset.remove);
    const { close } = openSheet(overlays, `<h4>移除“${a.name}”？</h4><p>只会从 Yumu 里移除登录信息，不影响账号本身。</p><div class="buttons"><button class="btn" data-close>取消</button><button class="btn danger" id="doRm">移除</button></div>`, 'confirm');
    $('#doRm', overlays).onclick = () => { close(); DATA.accounts.splice(DATA.accounts.indexOf(a), 1); if (a.active && DATA.accounts[0]) DATA.accounts[0].active = true; renderAccounts(); renderRail(); toast(overlays, '账号已移除'); };
  });
  const add = () => openSheet(overlays, `<h4>添加账号</h4><p class="sub">微软账号会打开浏览器登录；离线账号只需要一个名字。</p><div class="modlist">
    <div class="mrow" style="height:56px"><div class="mi">${icon('key', 14)}</div><div class="texts"><b>微软账号</b><small>正版验证，可以进服务器。</small></div><button class="btn primary" data-close>登录</button></div>
    <div class="mrow" style="height:56px"><div class="mi" style="background:var(--surface-sunken);color:var(--text-secondary)">${icon('user', 14)}</div><div class="texts"><b>离线账号</b><small>只能单机或进离线服务器。</small></div><button class="btn" data-close>添加</button></div></div>
    <div class="buttons"><button class="btn" data-close>取消</button></div>`);
  $('#accAdd', page).onclick = add; $('#accMs', page).onclick = add; $('#accOff', page).onclick = add;
}

/* ---------- 设置页 ---------- */
function renderSettings() {
  renderToolbar();
  const sec = SETTINGS_SECTIONS.find(s => s.id === state.settingsSection) || SETTINGS_SECTIONS[0];
  const page = mount(`<div class="settings"><nav>${SETTINGS_SECTIONS.map(s => `<button class="${s.id === sec.id ? 'on' : ''}" data-sec="${s.id}">${icon(s.icon)}${s.name}</button>`).join('')}</nav>
    <div class="content"><h2>${sec.name}</h2>${settingsSection(sec.id)}</div></div>`);

/* ---------- 欢迎与空状态 ---------- */
function renderWelcome() {
  renderToolbar();
  const page = mount(`<div class="welcome">
    <div class="stepper"><span class="s done"><i>${icon('check', 11)}</i>登录账号</span><span class="line"></span><span class="s cur"><i>2</i>导入或新建</span><span class="line"></span><span class="s"><i>3</i>开始游戏</span></div>
    <div class="collage">${['forest', 'cave', 'sky', 'nether'].map((b, i) => `<i style="background-image:${cover('w' + i, b, 24, 15)};--r:${(i - 1.5) * 4}deg;animation-delay:${i * 60}ms"></i>`).join('')}</div>
    <div><h1>欢迎使用 Yumu</h1><p style="margin-top:8px">一个简洁、轻量的 Minecraft 启动器。三步就能开始，剩下的交给它。</p></div>
    <div class="steps">
      <div class="step done"><div class="n">${icon('check', 14)}</div><b>登录账号</b><small>已用微软账号 Steve 登录。</small></div>
      <div class="step"><div class="n">2</div><b>导入或新建</b><small>拖入整合包，或者从本机发现 3 个已有的存档。</small><button class="btn" id="wDiscover" style="align-self:flex-start;margin-top:4px">${icon('laptop')}导入本机存档</button></div>
      <div class="step"><div class="n">3</div><b>开始游戏</b><small>Java、游戏文件自动准备好，点一下就行。</small></div>
    </div>
    <div style="display:flex;gap:10px"><button class="btn primary xl" id="wNew">${icon('plus', 18)}新建实例</button><button class="btn xl" id="wPacks">${icon('package', 18)}浏览整合包</button><button class="btn xl quiet" id="wSkip">以后再说</button></div>
  </div>`);
  $('#wNew', page).onclick = () => { state.welcomeDone = true; openNew(); }; $('#wPacks', page).onclick = () => { state.welcomeDone = true; go('/packs'); }; $('#wSkip', page).onclick = () => { state.welcomeDone = true; go('/'); };
  $('#wDiscover', page).onclick = () => openSheet(overlays, `<h4>本机已有的 Minecraft</h4><p class="sub">在官方启动器里找到这些，勾选要导入的。</p><div class="modlist">${[['官方启动器 · 1.21.4', '2 个存档 · 1.1 GB'], ['官方启动器 · 1.20.1 (Forge)', '1 个存档 · 24 个模组'], ['HMCL · 生存', '1 个存档']].map(([a, b]) => `<div class="mrow"><div class="mi">${icon('laptop', 14)}</div><div class="texts"><b>${a}</b><small>${b}</small></div><button class="switch" aria-checked="true"></button></div>`).join('')}</div><div class="buttons"><button class="btn" data-close>取消</button><button class="btn primary" data-close>导入 3 个</button></div>`);
}
function renderEmpty() {
  renderToolbar();
  const page = mount(`<div class="empty"><div class="art">${icon('cube', 44)}</div><h2>还没有实例</h2><p>新建一个实例，或者导入整合包，剩下的交给 Yumu。</p>
    <div style="display:flex;gap:10px;margin-top:6px"><button class="btn primary large" id="eNew">新建实例</button><button class="btn large" id="ePacks">浏览整合包</button><button class="btn large" id="eDrop">导入整合包</button></div><span class="hint">拖入 .mrpack 即可导入</span></div>`);
  $('#eNew', page).onclick = () => openNew(); $('#ePacks', page).onclick = () => go('/packs'); $('#eDrop', page).onclick = simulateDrop;
}

/* ---------- 行为 ---------- */
function play(id) {
  const ins = instances.find(i => i.id === id); if (!ins) return; state.crash = state.crash === id ? null : state.crash; state.lastId = id;
  state.activity[id] = 'preparing'; refresh();
  setTimeout(() => {
    state.activity[id] = 'installing'; refresh();
    let done = 0; const total = 412;
    const t = setInterval(() => {
      done = Math.min(total, done + 20 + Math.random() * 40);
      $$('.instNum').forEach(n => n.textContent = `正在安装… ${Math.round(done)} / ${total} MB`);
      if (done >= total) { clearInterval(t); setTimeout(() => { delete state.activity[id]; state.running[id] = Date.now(); ins.lastPlayed = '刚刚'; refresh(); toast(overlays, `${ins.name} 已启动`); }, 300); }
    }, 160);
  }, 700);
}
function stop(id) { delete state.running[id]; refresh(); const ins = instances.find(i => i.id === id); ins && toast(overlays, `${ins.name} 已结束`); }
function refresh() {
  renderRail(); renderToolbar();
  const p = activePane(); if (!p) return; const [r] = route();
  if (r === 'instance' && current()) renderPlayStatus(p, current(), 'large');
  else if (!r || r === 'instances') { renderRunStrip(p); renderHero(p); renderGrid($('#grid', p)); }
}

function moreItems(ins) { return [
  { icon: 'folder', label: '打开文件夹' }, { icon: 'package', label: '导出为 .mrpack…' }, '-',
  { icon: 'copy', label: '复制实例', run: () => duplicate(ins) }, { icon: 'pen', label: '重命名…', run: () => rename(ins) }, { icon: 'gear', label: '实例设置', run: () => { state.tab = 'settings'; go('/instance/' + ins.id + '/settings'); } }, '-',
  { icon: 'trash', label: '删除实例', danger: true, run: () => confirmDelete(ins) } ]; }
function contextMenu(e, ins) { menu(main, e.clientX, e.clientY, [state.running[ins.id] ? { icon: 'stop', label: '结束游戏', run: () => stop(ins.id) } : { icon: 'play', label: '开始游戏', run: () => play(ins.id) }, { icon: 'arrowRight', label: '打开实例', run: () => { state.tab = 'overview'; go('/instance/' + ins.id); } }, { icon: ins.favorite ? 'star' : 'starFill', label: ins.favorite ? '取消收藏' : '收藏', run: () => { ins.favorite = !ins.favorite; refresh(); } }, '-', ...moreItems(ins)]); }

function openNew(preset) {
  const { sheet, close } = openSheet(overlays, `<h4>新建实例</h4><p class="sub">不改任何项直接创建也没问题。</p>${newInstanceForm()}<div class="buttons"><button class="btn" data-close>取消</button><button class="btn primary" id="nCreate">创建</button></div>`);
  bindDisclosures(sheet); bindIconPick(sheet);
  if (preset) { const b = $$('#nLoader button', sheet).find(b => b.textContent === preset); b && b.click(); }
  setTimeout(() => $('#nName', sheet).focus(), 60);
  $('#nCreate', sheet).onclick = () => {
    const loader = $('#nLoader [aria-selected="true"]', sheet).textContent; const ver = $('#nVer', sheet).value.replace(/（.*）|显示全部版本…/g, '') || '26.3';
    const name = $('#nName', sheet).value.trim() || ver; const biome = $('.iconpick button.on', sheet).title || 'forest';
    const id = 'n' + Date.now();
    instances.push({ id, name, loader: loader === '原版' ? null : loader, loaderVersion: loader === '原版' ? '' : '最新', version: ver, biome, lastPlayed: '从未', playtime: '0 分钟', hours: 0, favorite: false, mods: [], shaders: [], packs: [], worlds: [] });
    close(); state.tab = 'overview'; state.welcomeDone = true; go('/instance/' + id); toast(overlays, `已创建「${name}」`);
  };
}
function duplicate(ins) { const id = 'd' + Date.now(); instances.push({ ...ins, id, name: ins.name + ' 副本', favorite: false, lastPlayed: '从未', playtime: '0 分钟', hours: 0 }); state.tab = 'overview'; go('/instance/' + id); toast(overlays, '实例已复制'); }
function rename(ins) { const { sheet, close } = openSheet(overlays, `<h4>重命名</h4><div class="field large"><input id="rn" value="${ins.name}"></div><div class="buttons"><button class="btn" data-close>取消</button><button class="btn primary" id="rnOk">重命名</button></div>`, 'confirm'); setTimeout(() => $('#rn', sheet).select(), 60); $('#rnOk', sheet).onclick = () => { ins.name = $('#rn', sheet).value.trim() || ins.name; close(); if (route()[0] === 'instance' && state.selected === ins.id) renderInstance(); else refresh(); }; }
function confirmDelete(ins) {
  const { close } = openSheet(overlays, `<h4>删除“${ins.name}”？</h4><p>它的 ${ins.worlds.length} 个存档和设置也会一起删除，不能撤销。</p><div class="buttons"><button class="btn" data-close>取消</button><button class="btn danger" id="doDel">删除实例</button></div>`, 'confirm');
  $('#doDel', overlays).onclick = () => {
    close(); const card = $(`.card[data-id="${ins.id}"]`, scroll); card && card.classList.add('leave');
    setTimeout(() => {
      const i = instances.indexOf(ins); if (i > -1) instances.splice(i, 1); delete state.running[ins.id]; delete state.activity[ins.id];
      if (state.lastId === ins.id) state.lastId = instances[0]?.id; if (state.selected === ins.id) state.selected = instances[0]?.id;
      const [r] = route(); if (r === 'instance' || !instances.length) { if (location.hash === '#/' || !location.hash) renderEmpty(); else go('/'); } else refresh();
      toast(overlays, '实例已删除', '撤销');
    }, 280);
  };
}
function simulateDrop() {
  const d = el(`<div class="drop"><div class="box">${icon('import', 48)}拖入 .mrpack 即可导入</div></div>`); overlays.appendChild(d);
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 200); importPack(DATA.packs[0]); }, 1000);
}
function importPack(pack) {
  if (state.importing) return; state.importing = pack.name;
  $('#importSlot').innerHTML = `<div class="import-status enter"><span id="impText">正在安装「${pack.name}」… 0%</span><div class="progress"><i id="impBar"></i></div></div>`;
  let p = 0; const t = setInterval(() => {
    p = Math.min(100, p + 3 + Math.random() * 8); const bar = $('#impBar'), txt = $('#impText');
    if (bar) { bar.style.width = p + '%'; txt.textContent = `正在安装「${pack.name}」… ${Math.round(p)}%`; }
    if (p >= 100) { clearInterval(t); setTimeout(() => {
      const s = $('#importSlot').firstElementChild; if (s) { s.classList.add('leave'); setTimeout(() => s.remove(), 300); }
      const id = 'p' + Date.now();
      instances.push({ id, name: pack.name, loader: pack.loader, loaderVersion: '最新', version: pack.version, biome: pack.biome, lastPlayed: '从未', playtime: '0 分钟', hours: 0, favorite: false, mods: [...MODS.perf, ...MODS.qol.slice(0, 2)], shaders: [], packs: [], worlds: [] });
      state.importing = null; state.tab = 'overview'; state.welcomeDone = true; go('/instance/' + id); toast(overlays, '整合包已安装');
    }, 300); }
  }, 150);
}
$('#railAvatar').onclick = () => {
  if ($('.popover', app)) { $('.popover', app).remove(); return; }
  const p = el(`<div class="popover">${DATA.accounts.map(a => `<div class="prow" data-acc="${a.id}"><div class="avatar">${face(a.id, 32)}</div><div class="texts"><div>${a.name}</div><small>${a.kind}</small></div>${a.active ? icon('check') : ''}</div>`).join('')}<hr><div class="prow" style="color:var(--accent)" data-add-acc>${icon('plus')}<div class="texts">添加账号…</div></div><div class="prow" data-go-acc>${icon('users')}<div class="texts">管理账号</div></div></div>`);
  $$('[data-acc]', p).forEach(r => r.onclick = () => { DATA.accounts.forEach(a => a.active = a.id === r.dataset.acc); p.remove(); renderRail(); if (route()[0] === 'accounts') renderAccounts(); });
  $('[data-go-acc]', p).onclick = () => { p.remove(); go('/accounts'); };
  $('[data-add-acc]', p).onclick = () => { p.remove(); go('/accounts'); };
  app.appendChild(p);
  setTimeout(() => document.addEventListener('pointerdown', function h(e) { if (!p.contains(e.target) && !$('#railAvatar').contains(e.target)) { p.remove(); document.removeEventListener('pointerdown', h); } }), 0);
};
$('#railSettings').onclick = () => go('/settings/' + state.settingsSection);
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'n') { e.preventDefault(); openNew(); } if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); go('/settings/' + state.settingsSection); } });

/* ---------- 启动 ---------- */
applyTheme('#C47A2C');
hydrateIcons();
designBar({ name: '方案二 · 工作台', scenes: [{ id: 'welcome', label: '欢迎页' }, { id: 'crash', label: '模拟崩溃' }, { id: 'multi', label: '同时运行两个' }, { id: 'drop', label: '拖入整合包' }, { id: 'empty', label: '空状态' }, { id: 'reset', label: '重置' }],
  rerender: () => { applyTheme('#C47A2C'); renderRail(); }, scene: id => {
    if (id === 'welcome') { state.welcomeDone = false; go('/welcome'); }
    if (id === 'crash') {
      const target = route()[0] === 'instance' ? state.selected : (state.lastId || instances[0]?.id); if (!target) return;
      delete state.running[target]; delete state.activity[target]; state.crash = target; state.selected = target; state.tab = 'overview';
      const h = `#/instance/${target}/overview`; if (location.hash === h) renderInstance(); else location.hash = h; renderRail(); renderToolbar();
    }
    if (id === 'multi') { ['survival', 'create'].forEach(id => { if (instances.find(i => i.id === id) && !state.running[id] && !state.activity[id]) play(id); }); }
    if (id === 'drop') simulateDrop();
    if (id === 'empty') { instances.splice(0, instances.length); state.running = {}; state.activity = {}; state.lastId = null; if (location.hash === '#/' || !location.hash) renderEmpty(); else go('/'); renderRail(); }
    if (id === 'reset') location.reload();
  } });
router(parts => {
  $$('.runpop', overlays).forEach(x => x.remove()); $$('.popover', app).forEach(x => x.remove()); $$('.menu', main).forEach(x => x.remove());
  const [p, a, b] = parts;
  if (!state.welcomeDone && p !== 'welcome') { go('/welcome'); return; }
  if (p === 'instance' && instances.find(i => i.id === a)) { state.selected = a; if (b) state.tab = b; renderInstance(); }
  else if (p === 'instance') { go('/'); return; }
  else if (p === 'instances') { state.backTo = '/instances'; instances.length ? renderInstances() : renderEmpty(); }
  else if (p === 'packs') renderPacks();
  else if (p === 'accounts') renderAccounts();
  else if (p === 'settings') { state.settingsSection = a || 'general'; renderSettings(); }
  else if (p === 'welcome') renderWelcome();
  else if (!instances.length) { state.backTo = '/'; renderEmpty(); }
  else { state.backTo = '/'; renderHome(); }
  renderRail();
});
</script>

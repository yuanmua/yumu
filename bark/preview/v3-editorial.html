<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yumu · 方案三 素木</title>
<link rel="stylesheet" href="shared.css?v=3">
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif;
  --type-body: 13px;
  --radius-sm: 10px; --radius-md: 12px; --radius-lg: 18px; --radius-xl: 28px;
  --bg-canvas: #FAFAF8; --bg-sidebar: #F2F2EF; --surface-default: #FFFFFF; --surface-elevated: #FFFFFF; --surface-sunken: #F0F0ED;
  --surface-hover: rgba(0,0,0,.04); --surface-pressed: rgba(0,0,0,.07);
  --border-subtle: rgba(0,0,0,.08); --border-strong: rgba(0,0,0,.18);
  --text-primary: #141414; --text-secondary: #6B6B68; --text-tertiary: #9C9C98;
  --success: #2F8A5A; --warning: #C6882A; --danger: #C9453B;
  --elev-raised: 0 1px 1px rgba(0,0,0,.03), 0 2px 8px rgba(0,0,0,.04);
  --elev-overlay: 0 1px 3px rgba(0,0,0,.06), 0 16px 48px rgba(0,0,0,.14);
  --primary-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 30%, transparent);
}
[data-theme="dark"] {
  --bg-canvas: #121212; --bg-sidebar: #0C0C0C; --surface-default: #1A1A1A; --surface-elevated: #222222; --surface-sunken: #0C0C0C;
  --surface-hover: rgba(255,255,255,.05); --surface-pressed: rgba(255,255,255,.09);
  --border-subtle: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.18);
  --text-primary: #F4F4F2; --text-secondary: #A3A3A0; --text-tertiary: #6A6A67;
  --success: #4FB57D; --warning: #E0A94A; --danger: #E26B61;
  --elev-raised: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
  --elev-overlay: 0 2px 6px rgba(0,0,0,.5), 0 18px 50px rgba(0,0,0,.6);
}
[data-density="compact"] { --type-body: 12px; }

.app { position: fixed; inset: 0; display: grid; grid-template-columns: 236px 1fr; background: var(--bg-canvas); overflow: hidden; }
.app[data-frame="win"] { font-family: "Segoe UI Variable Text", "Segoe UI", var(--font); }
.app[data-frame="linux"] { font-family: Cantarell, Inter, var(--font); }

/* 侧栏 */
.sidebar { background: var(--bg-sidebar); display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border-subtle); }
.sb-top { height: 52px; display: flex; align-items: center; padding: 0 16px; gap: 8px; -webkit-app-region: drag; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.app:not([data-frame="mac"]) .lights { display: none; }
.sb-brand { display: none; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.01em; }
.sb-brand i { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.app:not([data-frame="mac"]) .sb-brand { display: flex; }
.sb-search { padding: 0 12px 8px; }
.sb-search .field { background: var(--surface-default); box-shadow: inset 0 0 0 1px var(--border-subtle); }
.sb-search .field:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.sb-list { flex: 1; overflow: auto; padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 1px; }
.sb-head { font-size: 11px; font-weight: 600; color: var(--text-tertiary); letter-spacing: .05em; padding: 14px 10px 6px; display: flex; align-items: center; gap: 6px; }
.sb-head .count { margin-left: auto; font-weight: 500; }
.sb-row { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border-radius: var(--radius-sm); cursor: default; user-select: none; position: relative; transition: background var(--motion-quick); }
.sb-row:hover { background: var(--surface-hover); }
.sb-row.on { background: var(--accent-tint); }
.sb-row .thumb { width: 28px; height: 28px; border-radius: 7px; background-size: cover; background-position: center; image-rendering: pixelated; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
[data-density="compact"] .sb-row { height: 34px; } [data-density="compact"] .sb-row .thumb { width: 22px; height: 22px; border-radius: 6px; }
.sb-row .texts { flex: 1; min-width: 0; line-height: 1.2; }
.sb-row .texts span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.sb-row .texts small { color: var(--text-tertiary); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-row.running small { color: var(--success); font-variant-numeric: tabular-nums; }
.sb-row .stop { opacity: 0; transition: opacity var(--motion-quick); width: 26px; height: 26px; }
.sb-row:hover .stop { opacity: 1; }
.sb-row:hover .dot { display: none; }
.sb-row .stop:hover { color: var(--danger); }
.sb-bottom { padding: 10px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border-subtle); }
.sb-actions { display: flex; gap: 6px; }
.sb-actions .btn { flex: 1; }
.account-bar { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background var(--motion-quick); position: relative; }
.account-bar:hover { background: var(--surface-hover); }
.account-bar .avatar { width: 28px; height: 28px; border-radius: 7px; overflow: hidden; flex: none; }
.account-bar .texts { flex: 1; min-width: 0; line-height: 1.2; }
.account-bar .texts small { color: var(--text-secondary); font-size: 11px; }
.import-status { margin: 0 0 4px; padding: 10px 12px; background: var(--surface-default); border-radius: var(--radius-sm); display: grid; gap: 6px; font-size: 11px; color: var(--text-secondary); box-shadow: inset 0 0 0 1px var(--border-subtle); }

/* 主区 */
.main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.main-toolbar { height: 52px; flex: none; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; gap: 4px; z-index: 5; -webkit-app-region: drag; background: transparent; }
.main-toolbar .btn { -webkit-app-region: no-drag; }
.running-pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--surface-elevated); box-shadow: inset 0 0 0 1px var(--border-subtle); font-size: 12px; font-weight: 500; margin-right: 8px; cursor: pointer; border: 0; color: var(--text-primary); -webkit-app-region: no-drag; }
.running-pill:hover { background: var(--surface-sunken); }
.wincontrols { display: none; gap: 2px; margin-left: 8px; }
.wincontrols i { width: 40px; height: 30px; display: grid; place-items: center; color: inherit; border-radius: 4px; font-size: 11px; }
.wincontrols i:last-child:hover { background: #c42b1c; color: #fff; }
.app[data-frame="win"] .wincontrols { display: flex; }
.gnome { display: none; margin-left: 8px; }
.gnome i { width: 24px; height: 24px; border-radius: 50%; background: rgba(128,128,128,.25); display: grid; place-items: center; font-size: 11px; }
.app[data-frame="linux"] .gnome { display: flex; }
.scroll { flex: 1; overflow: auto; min-height: 0; position: relative; }
.column { max-width: 840px; margin: 0 auto; padding: 40px 36px 72px; }
.column.wide { max-width: 980px; }

/* 通用：内嵌卡片 */
.card { background: var(--surface-default); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--border-subtle); overflow: hidden; }
.card .chead { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--border-subtle); min-height: 46px; }
.card .chead small { color: var(--text-tertiary); font-weight: 400; }
.card .chead .btn { margin-left: auto; }
.card .chead svg { color: var(--text-secondary); }
.card .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 52px; }
.card .row + .row { border-top: 1px solid var(--border-subtle); }
.card .row .texts { flex: 1; min-width: 0; line-height: 1.3; }
.card .row .texts b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .row .texts small { color: var(--text-secondary); font-size: 12px; display: block; }
.card .row .btn.icon { opacity: 0; transition: opacity var(--motion-quick); }
.card .row:hover .btn.icon, .card .row .btn.icon.show { opacity: 1; }
.card .cempty { padding: 32px; text-align: center; color: var(--text-tertiary); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.card .cfoot { padding: 10px 16px; border-top: 1px solid var(--border-subtle); color: var(--text-tertiary); font-size: 12px; display: flex; align-items: center; gap: 8px; }
.wthumb { width: 44px; height: 44px; border-radius: 10px; background-size: cover; background-position: center; image-rendering: pixelated; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.mi { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-tint); color: var(--accent); display: grid; place-items: center; flex: none; }
.mi.plain { background: var(--surface-sunken); color: var(--text-secondary); }
.section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; padding: 0 2px; }
.section-head h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.section-head small { color: var(--text-tertiary); }
.section-head .btn { margin-left: auto; }
.bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.bar .field { flex: 1; max-width: 320px; background: var(--surface-default); box-shadow: inset 0 0 0 1px var(--border-subtle); }
.bar .field:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.notice { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--danger-tint); color: var(--text-primary); margin-bottom: 18px; }
.notice svg { color: var(--danger); flex: none; }
.notice .texts { flex: 1; } .notice b { display: block; } .notice small { color: var(--text-secondary); }
.tl .row { align-items: flex-start; min-height: 0; padding: 12px 16px; }
.tl .row .dot { margin-top: 5px; background: var(--border-strong); }
.tl .row .texts small { margin-top: 1px; }
.tl .row time { margin-left: auto; color: var(--text-tertiary); font-size: 12px; white-space: nowrap; }

/* 实例页：头部 */
.ihead { display: flex; align-items: center; gap: 28px; }
.ihead .art { width: 128px; height: 128px; border-radius: 32px; background-size: cover; background-position: center; image-rendering: pixelated; flex: none; box-shadow: 0 12px 32px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06), inset 0 0 0 1px rgba(0,0,0,.06); }
.ihead .texts { flex: 1; min-width: 0; }
.ihead .name { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; display: flex; align-items: center; gap: 12px; }
.ihead .name .fav { color: var(--text-tertiary); cursor: pointer; display: inline-flex; transition: color var(--motion-quick), transform var(--motion-quick); }
.ihead .name .fav.on { color: var(--warning); }
.ihead .name .fav:hover { transform: scale(1.1); }
.ihead .sub { color: var(--text-secondary); font-size: 14px; margin-top: 8px; }
.ihead .status { margin-top: 10px; min-height: 22px; display: flex; align-items: center; gap: 8px; color: var(--text-tertiary); font-size: 12px; }
.ihead .status .tag { height: 22px; font-size: 12px; padding: 0 8px; }
.ihead .status .tag .dot { width: 6px; height: 6px; }
.actions { display: flex; gap: 8px; align-items: center; margin-top: 28px; }
.actions .btn.xl:not(.primary) { min-width: 0; padding: 0 18px; }
.actions .btn.more { width: 48px; min-width: 0; padding: 0; }
.actions .btn.xl { height: 48px; }

/* 实例页：统计条 */
.strip { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface-default); border-radius: 14px; box-shadow: inset 0 0 0 1px var(--border-subtle); margin-top: 32px; }
.strip .cell { padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; border-left: 1px solid var(--border-subtle); min-width: 0; }
.strip .cell:first-child { border-left: 0; }
.strip .cell small { color: var(--text-secondary); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.strip .cell b { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .cell b em { font-style: normal; font-size: 13px; color: var(--text-tertiary); font-weight: 500; margin-left: 4px; letter-spacing: 0; }
.strip .cell b.text { font-size: 18px; padding: 3px 0; }

/* 分段（大） */
.segmented.large { height: 36px; border-radius: 999px; background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--border-subtle); margin-top: 28px; }
.segmented.large button { border-radius: 999px; padding: 0 16px; font-size: 13px; }
.segmented.large .thumb { border-radius: 999px; }
.segmented.large .count { font-size: 11px; color: var(--text-tertiary); }
.tabbody { padding-top: 22px; position: relative; }

/* 模组行 */
.mrow .tag { margin-right: 2px; }

/* 日志 */
.console { background: #141414; color: #d7d3cb; border-radius: 14px; padding: 16px 18px; font: 12px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; max-height: 440px; overflow: auto; white-space: pre; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.console .i { color: #8fa9c6; } .console .w { color: #e0a94a; } .console .e { color: #e26b61; }

/* 整合包页 */
.ptitle h1 { margin: 0 0 6px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.ptitle p { margin: 0 0 20px; color: var(--text-secondary); font-size: 14px; max-width: 560px; }
.ptitle .field.large { background: var(--surface-default); box-shadow: inset 0 0 0 1px var(--border-subtle); height: 42px; }
.ptitle .field.large:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 20px; }
.chip { height: 28px; padding: 0 12px; border-radius: 999px; background: transparent; box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--text-secondary); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: 0; transition: all var(--motion-quick); }
.chip:hover { background: var(--surface-hover); color: var(--text-primary); }
.chip.on { background: var(--text-primary); color: var(--bg-canvas); box-shadow: none; }
.prow { display: flex; align-items: center; gap: 18px; height: 96px; padding: 0 16px; }
.prow + .prow { border-top: 1px solid var(--border-subtle); }
.prow .pcover { width: 128px; height: 72px; border-radius: 10px; background-size: cover; background-position: center; image-rendering: pixelated; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.prow .texts { flex: 1; min-width: 0; }
.prow .texts b { font-size: 15px; font-weight: 600; display: block; letter-spacing: -0.01em; }
.prow .texts small { color: var(--text-secondary); font-size: 12px; display: block; margin-top: 1px; }
.prow .texts p { margin: 5px 0 0; color: var(--text-secondary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .ptags { display: flex; gap: 4px; margin-top: 7px; }
.prow .btn { flex: none; }

/* 设置页 */
.settings { display: grid; grid-template-columns: 196px 1fr; gap: 36px; align-items: start; }
.settings nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; }
.settings nav h2 { margin: 0 10px 14px; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.settings nav button { appearance: none; border: 0; background: transparent; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--text-primary); cursor: pointer; font-weight: 500; transition: background var(--motion-quick); text-align: left; }
.settings nav button:hover { background: var(--surface-hover); }
.settings nav button.on { background: var(--accent); color: #fff; }
.settings nav .sq { width: 24px; height: 24px; border-radius: 7px; background: var(--c); color: #fff; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.settings .content { min-width: 0; padding-top: 4px; }
.settings .content h2 { margin: 0 0 18px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }

/* 欢迎页与空状态 */
.welcome { max-width: 640px; margin: 0 auto; padding: 48px 0 40px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }
.welcome .collage { display: flex; width: 100%; height: 120px; border-radius: 18px; overflow: hidden; box-shadow: var(--elev-raised), inset 0 0 0 1px var(--border-subtle); }
.welcome .collage i { flex: 1; background-size: cover; background-position: center; image-rendering: pixelated; display: block; animation: rowIn var(--motion-emphasized) both; }
.welcome h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
.welcome p.lead { margin: 10px 0 0; color: var(--text-secondary); font-size: 15px; max-width: 440px; }
.welcome .card { width: 100%; text-align: left; }
.welcome .card .row { padding: 14px 16px; min-height: 64px; gap: 14px; }
.welcome .n { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-sunken); color: var(--text-secondary); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; box-shadow: inset 0 0 0 1px var(--border-subtle); }
.welcome .n.done { background: var(--success); color: #fff; box-shadow: none; }
.welcome .row .texts b { font-size: 14px; font-weight: 600; }
.welcome .row .btns { display: flex; gap: 6px; flex: none; }
.welcome .skip { color: var(--text-tertiary); font-size: 13px; cursor: pointer; background: transparent; border: 0; padding: 4px 8px; border-radius: 6px; }
.welcome .skip:hover { color: var(--text-primary); background: var(--surface-hover); }
.empty { max-width: 520px; margin: 0 auto; min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 40px 0; }
.empty .art { width: 96px; height: 96px; border-radius: 28px; background: var(--surface-default); display: grid; place-items: center; color: var(--text-tertiary); box-shadow: inset 0 0 0 1px var(--border-subtle); }
.empty h2 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; } .empty p { margin: 0; color: var(--text-secondary); max-width: 380px; }
.empty .hint { color: var(--text-tertiary); font-size: 12px; }

/* 账号弹层 */
.popover { position: absolute; left: 10px; bottom: 60px; z-index: 60; width: 216px; background: var(--surface-elevated); border-radius: 14px; box-shadow: var(--elev-overlay), inset 0 0 0 1px var(--border-subtle); padding: 6px; transform-origin: bottom left; animation: menuIn var(--motion-standard) both; }
.popover .prow { display: flex; align-items: center; gap: 10px; padding: 8px; height: auto; border-radius: var(--radius-sm); cursor: pointer; border-top: 0 !important; }
.popover .prow:hover { background: var(--surface-hover); }
.popover .prow .avatar { width: 30px; height: 30px; border-radius: 8px; overflow: hidden; }
.popover .prow .texts { flex: 1; line-height: 1.2; } .popover .prow small { color: var(--text-secondary); font-size: 11px; }
.popover hr { border: 0; border-top: 1px solid var(--border-subtle); margin: 4px 8px; }

/* 运行中弹层 */
.runpop { position: absolute; top: 48px; right: 12px; z-index: 60; width: 300px; background: var(--surface-elevated); border-radius: 14px; box-shadow: var(--elev-overlay), inset 0 0 0 1px var(--border-subtle); padding: 6px; animation: menuIn var(--motion-standard) both; transform-origin: top right; }
.runpop .rrow { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-sm); }
.runpop .rrow:hover { background: var(--surface-hover); }
.runpop .thumb { width: 32px; height: 32px; border-radius: 8px; background-size: cover; image-rendering: pixelated; }
.runpop .texts { flex: 1; line-height: 1.2; } .runpop .texts small { color: var(--success); font-size: 11px; font-variant-numeric: tabular-nums; }
.runpop .head { padding: 8px 10px 4px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); letter-spacing: .05em; }

.sheet .segmented button { padding: 0 10px; }
</style>
</head>
<body>
<div class="app" id="app" data-frame="mac">
  <aside class="sidebar">
    <div class="sb-top"><div class="lights"><i></i><i></i><i></i></div><div class="sb-brand"><i data-icon="cube" data-size="12"></i>Yumu</div></div>
    <div class="sb-search"><div class="field"><span data-icon="search"></span><input placeholder="搜索实例" id="sbSearch"></div></div>
    <div class="sb-list" id="sbList"></div>
    <div class="sb-bottom">
      <div id="importSlot"></div>
      <div class="sb-actions"><button class="btn" id="sbNew"><span data-icon="plus"></span>新建</button><button class="btn" id="sbPacks"><span data-icon="package"></span>整合包</button><button class="btn icon" id="sbSettings" title="设置"><span data-icon="gear"></span></button></div>
      <div class="account-bar" id="accountBar"></div>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="main-toolbar" id="toolbar"></div>
    <div class="scroll" id="scroll"></div>
    <div id="overlays"></div>
  </main>
</div>
<script src="shared.js?v=3"></script>
<script>
const ACCENT = '#3B6FD4';
const state = { selected: 'survival', tab: 'overview', activity: {}, running: {}, crash: null, importing: null, settingsSection: 'general', welcomeDone: true };
const instances = DATA.instances;
const current = () => instances.find(i => i.id === state.selected);
const main = $('#main'), overlays = $('#overlays'), scroll = $('#scroll'), toolbar = $('#toolbar');

/* ---------- 侧栏 ---------- */
function elapsed(id) { const s = Math.floor((Date.now() - state.running[id]) / 1000); const m = Math.floor(s / 60), h = Math.floor(m / 60); return h ? `${h} 小时 ${m % 60} 分` : `${m} 分 ${String(s % 60).padStart(2, '0')} 秒`; }
function sbRow(ins, extra = '') {
  const act = state.activity[ins.id], running = state.running[ins.id];
  const sub = running ? `运行中 · ${elapsed(ins.id)}` : act === 'preparing' ? '准备中…' : act === 'installing' ? '正在安装…' : `${ins.loader || '原版'} · ${ins.version}`;
  const right = running ? `<span class="dot success breathe"></span><button class="btn icon stop" title="结束游戏" data-stop="${ins.id}">${icon('stop', 14)}</button>` : act ? '<span class="spinner"></span>' : ins.favorite ? `<span style="color:var(--warning)">${icon('starFill', 12)}</span>` : '';
  return `<div class="sb-row ${ins.id === state.selected && location.hash.startsWith('#/instance') ? 'on' : ''} ${running ? 'running' : ''} ${extra}" data-id="${ins.id}">
    ${SETTINGS.sidebarCovers ? `<div class="thumb" style="background-image:${cover(ins.id, ins.biome, 8, 8)}"></div>` : `<span style="color:var(--accent)">${icon(ins.loader ? 'puzzle' : 'cube')}</span>`}
    <div class="texts"><span>${ins.name}</span><small>${sub}</small></div>${right}</div>`;
}
function renderSidebar(opts = {}) {
  const q = ($('#sbSearch').value || '').trim();
  const list = instances.filter(i => !q || i.name.includes(q));
  const running = list.filter(i => state.running[i.id]);
  const fav = list.filter(i => i.favorite && !state.running[i.id]);
  const rest = list.filter(i => !i.favorite && !state.running[i.id]);
  let html = '';
  if (running.length) html += `<div class="sb-head"><span class="dot success breathe"></span>正在运行<span class="count">${running.length}</span></div>` + running.map(i => sbRow(i)).join('');
  if (fav.length) html += `<div class="sb-head">收藏</div>` + fav.map(i => sbRow(i)).join('');
  if (rest.length) html += `<div class="sb-head">${fav.length || running.length ? '其他' : '全部'}<span class="count">${rest.length}</span></div>` + rest.map(i => sbRow(i, opts.initial ? 'enter' : '')).join('');
  if (!list.length) html += `<div style="padding:24px 12px;color:var(--text-tertiary);text-align:center">${q ? '没有匹配的实例' : '还没有实例'}</div>`;
  $('#sbList').innerHTML = html;
  $$('.sb-row', $('#sbList')).forEach((r, n) => {
    if (opts.initial) r.style.animationDelay = Math.min(n, 6) * 20 + 'ms';
    r.onclick = e => { if (e.target.closest('[data-stop]')) return; go('/instance/' + r.dataset.id); };
    r.oncontextmenu = e => { e.preventDefault(); contextMenu(e, instances.find(i => i.id === r.dataset.id)); };
  });
  $$('[data-stop]', $('#sbList')).forEach(b => b.onclick = () => stop(b.dataset.stop));
  if (opts.enter) { const r = $(`.sb-row[data-id="${opts.enter}"]`); r && r.classList.add('enter', 'pop'); }
  const acc = DATA.accounts.find(a => a.active);
  $('#accountBar').innerHTML = `<div class="avatar">${face(acc.id, 28)}</div><div class="texts"><div>${acc.name}</div><small>${acc.kind}</small></div><span data-icon="chevronDown" style="color:var(--text-tertiary)"></span>`;
  hydrateIcons($('#accountBar'));
}
$('#sbSearch').oninput = () => renderSidebar();
setInterval(() => {
  if (!Object.keys(state.running).length) return;
  $$('.sb-row.running', $('#sbList')).forEach(r => { r.querySelector('small').textContent = `运行中 · ${elapsed(r.dataset.id)}`; });
  $$('.runpop .texts small[data-id]').forEach(s => s.textContent = `运行中 · ${elapsed(s.dataset.id)}`);
  $$('[data-elapsed]').forEach(s => { if (state.running[s.dataset.elapsed]) s.textContent = `运行中 · ${elapsed(s.dataset.elapsed)}`; });
}, 1000);

/* ---------- 工具栏 ---------- */
function renderToolbar() {
  const n = Object.keys(state.running).length;
  toolbar.innerHTML = `${n ? `<button class="running-pill" id="runPill"><span class="dot success breathe"></span>${n} 个实例运行中</button>` : ''}
    <button class="btn icon" title="导入整合包" id="tbImport">${icon('import')}</button>
    <button class="btn icon" title="新建实例" id="tbNew">${icon('plus')}</button>
    <div class="wincontrols"><i>&#x2500;</i><i>&#x25A1;</i><i>&#x2715;</i></div><div class="gnome"><i>&#x2715;</i></div>`;
  $('#tbImport').onclick = simulateDrop; $('#tbNew').onclick = openNew;
  const pill = $('#runPill'); if (pill) pill.onclick = () => {
    if ($('.runpop', overlays)) { $('.runpop', overlays).remove(); return; }
    const p = el(`<div class="runpop"><div class="head">正在运行</div>${Object.keys(state.running).map(id => { const i = instances.find(x => x.id === id); return `<div class="rrow"><div class="thumb" style="background-image:${cover(i.id, i.biome, 8, 8)}"></div><div class="texts"><div>${i.name}</div><small data-id="${id}">运行中 · ${elapsed(id)}</small></div><button class="btn quiet" data-go="${id}">查看</button><button class="btn icon" data-stop="${id}" title="结束游戏">${icon('stop', 14)}</button></div>`; }).join('')}</div>`);
    overlays.appendChild(p);
    $$('[data-go]', p).forEach(b => b.onclick = () => { p.remove(); go('/instance/' + b.dataset.go); });
    $$('[data-stop]', p).forEach(b => b.onclick = () => { p.remove(); stop(b.dataset.stop); });
    setTimeout(() => document.addEventListener('pointerdown', function h(e) { if (!p.contains(e.target) && e.target !== pill && !pill.contains(e.target)) { p.remove(); document.removeEventListener('pointerdown', h); } }), 0);
  };
}

/* ---------- 页面挂载 ---------- */
function mount(html, cls = '') {
  const old = scroll.firstElementChild;
  if (old) { old.classList.add('out'); setTimeout(() => old.remove(), 320); }
  const page = el(`<div class="pane ${cls}" style="min-height:100%">${html}</div>`);
  scroll.appendChild(page); scroll.scrollTop = 0; hydrateIcons(page); bindSwitches(page);
  return page;
}

    : act === 'preparing' ? `<span class="tag"><span class="spinner" style="width:10px;height:10px"></span>准备中…</span>`
    : state.crash === ins.id ? `<span class="tag danger">${icon('warning', 12)}上次运行崩溃</span>`
    : `${icon('check', 12)}<span>准备就绪</span>`;

    </div>
    <div class="disclosure" data-open="false" style="margin-bottom:18px"><button type="button">${icon('chevron')}高级</button><div class="body-wrap"><div><div class="sgroup" style="margin-top:12px">
      <div class="srow"><div class="stexts"><b>加载器版本</b></div><div class="scontrol"><div class="field select" style="width:180px"><select><option>${ins.loaderVersion || '——'}（已固定）</option><option>最新</option></select></div></div></div>
      <div class="srow"><div class="stexts"><b>JVM 参数</b><small>覆盖全局设置。</small></div><div class="scontrol"><div class="field" style="width:320px"><input placeholder="留空用默认值"></div></div></div>
      <div class="srow"><div class="stexts"><b>启动前命令</b><small>在游戏进程拉起前执行。</small></div><div class="scontrol"><div class="field" style="width:320px"><input placeholder="例如 ./sync-saves.sh"></div></div></div>
      <div class="srow"><div class="stexts"><b>环境变量</b></div><div class="scontrol"><button class="btn">编辑…</button></div></div>
    </div></div></div></div>
    <div class="sgroup"><div class="srow"><div class="stexts"><b style="color:var(--danger)">删除实例</b><small>存档、模组和设置会一起删除，不能撤销。</small></div><div class="scontrol"><button class="btn danger" id="delBtn">删除实例…</button></div></div></div>`;
  const pane = el(`<div class="pane">${html}</div>`); body.appendChild(pane);
  hydrateIcons(pane); bindSwitches(pane); bindDisclosures(pane); bindIconPick(pane); $$('.segmented', pane).forEach(s => segmented(s));
  $$('[data-tab-go]', pane).forEach(b => b.onclick = () => { const i = TABS.findIndex(t => t[0] === b.dataset.tabGo); $$('#tabs button', page)[i].click(); });
  $$('[data-biome]', pane).forEach(b => b.onclick = () => { ins.biome = b.dataset.biome; renderInstance(); renderSidebar(); });
  const f = $('#toFabric', pane); if (f) f.onclick = () => openNew('Fabric');
  const d = $('#delBtn', pane); if (d) d.onclick = () => confirmDelete(ins);
  $$('.row[data-world]', pane).forEach(w => w.onclick = () => !state.running[ins.id] && !state.activity[ins.id] && play(ins.id));
}

/* ---------- 整合包页 ---------- */
function renderPacks() {
  renderToolbar();
  const page = mount(`<div class="column"><div class="ptitle"><h1>整合包</h1><p>安装会新建一个实例，整合包需要的东西全部自动装好。拖入 .mrpack 也可以。</p>
    <div class="field large">${icon('search')}<input placeholder="搜索 Modrinth 整合包…"></div>
    <div class="chips"><button class="chip on">全部</button><button class="chip">优化</button><button class="chip">冒险</button><button class="chip">科技</button><button class="chip">魔法</button><button class="chip">空岛</button><button class="chip">原版+</button><span style="flex:1"></span><button class="chip">${icon('sliders', 13)}版本与加载器</button></div></div>
    <div class="card">${DATA.packs.map((p, i) => `<div class="prow"><div class="pcover" style="background-image:${cover(p.name, p.biome, 40, 22)}"></div><div class="texts"><b>${p.name}</b><small>${p.by} · ${p.dl} 次下载</small><p>${p.desc}</p><div class="ptags"><span class="tag">${p.loader}</span><span class="tag">${p.version}</span>${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div></div><button class="btn primary" data-install="${i}">安装</button></div>`).join('')}</div>
    <p class="small" style="margin-top:14px;text-align:center">数据来自 Modrinth · 下载量为累计值</p></div>`);
  $$('[data-install]', page).forEach(b => b.onclick = () => importPack(DATA.packs[b.dataset.install]));
  $$('.chip', page).forEach(c => c.onclick = () => { $$('.chip', page).forEach(x => x.classList.remove('on')); c.classList.add('on'); });
}

/* ---------- 设置页 ---------- */
const SEC_COLORS = { general: '#8E8E93', appearance: '#BF5AF2', download: '#0A84FF', java: '#FF9F0A', accounts: '#30D158', about: '#5E5CE6' };
function renderSettings() {
  renderToolbar();
  const sec = SETTINGS_SECTIONS.find(s => s.id === state.settingsSection) || SETTINGS_SECTIONS[0];
  const page = mount(`<div class="column wide"><div class="settings"><nav><h2>设置</h2>${SETTINGS_SECTIONS.map(s => `<button class="${s.id === sec.id ? 'on' : ''}" data-sec="${s.id}"><span class="sq" style="--c:${SEC_COLORS[s.id] || '#8E8E93'}">${icon(s.icon, 14)}</span>${s.name}</button>`).join('')}</nav>
    <div class="content"><h2>${sec.name}</h2>${settingsSection(sec.id)}</div></div></div>`);
  $$('[data-sec]', page).forEach(b => b.onclick = () => go('/settings/' + b.dataset.sec));
  bindSettings(page, (theme) => { applyTheme(ACCENT); if (theme) renderSettings(); renderSidebar(); });
}

/* ---------- 欢迎与空状态 ---------- */
function renderWelcome() {
  renderToolbar();
  const page = mount(`<div class="column"><div class="welcome">
    <div class="collage">${['forest', 'plains', 'cave', 'sky', 'nether', 'snow'].map((b, i) => `<i style="background-image:${cover('w' + i, b, 16, 15)};animation-delay:${i * 50}ms"></i>`).join('')}</div>
    <div><h1>欢迎使用 Yumu</h1><p class="lead">一个简洁、轻量的 Minecraft 启动器。三步就能开始，剩下的交给它。</p></div>
    <div class="card">
      <div class="row"><div class="n done">${icon('check', 14)}</div><div class="texts"><b>登录账号</b><small>已用微软账号 Steve 登录。</small></div><button class="btn quiet" id="wAccounts">管理</button></div>
      <div class="row"><div class="n">2</div><div class="texts"><b>导入或新建</b><small>拖入整合包，或者从本机发现 3 个已有的存档。</small></div><div class="btns"><button class="btn" id="wDiscover">${icon('laptop')}导入本机存档</button><button class="btn" id="wPacks">${icon('package')}浏览整合包</button><button class="btn primary" id="wNew">${icon('plus')}新建实例</button></div></div>
      <div class="row"><div class="n">3</div><div class="texts"><b>开始游戏</b><small>Java、游戏文件自动准备好，点一下就行。</small></div></div>
    </div>
    <button class="skip" id="wSkip">以后再说</button>
  </div></div>`);
  $('#wNew', page).onclick = () => { state.welcomeDone = true; openNew(); }; $('#wPacks', page).onclick = () => { state.welcomeDone = true; go('/packs'); }; $('#wSkip', page).onclick = () => { state.welcomeDone = true; go('/'); };
  $('#wAccounts', page).onclick = () => { state.welcomeDone = true; go('/settings/accounts'); };
  $('#wDiscover', page).onclick = () => openSheet(overlays, `<h4>本机已有的 Minecraft</h4><p class="sub">在官方启动器里找到这些，勾选要导入的。</p><div class="card">${[['官方启动器 · 1.21.4', '2 个存档 · 1.1 GB'], ['官方启动器 · 1.20.1 (Forge)', '1 个存档 · 24 个模组'], ['HMCL · 生存', '1 个存档']].map(([a, b]) => `<div class="row"><div class="mi">${icon('laptop', 14)}</div><div class="texts"><b>${a}</b><small>${b}</small></div><button class="switch" aria-checked="true"></button></div>`).join('')}</div><div class="buttons"><button class="btn" data-close>取消</button><button class="btn primary" data-close>导入 3 个</button></div>`);
}
function renderEmpty() {
  renderToolbar();
  const page = mount(`<div class="column"><div class="empty"><div class="art">${icon('cube', 44)}</div><h2>还没有实例</h2><p>新建一个实例，或者导入整合包，剩下的交给 Yumu。</p>
    <div style="display:flex;gap:10px;margin-top:6px"><button class="btn primary large" id="eNew">新建实例</button><button class="btn large" id="ePacks">浏览整合包</button><button class="btn large" id="eDrop">导入整合包</button></div><span class="hint">拖入 .mrpack 即可导入</span></div></div>`);
  $('#eNew', page).onclick = () => openNew(); $('#ePacks', page).onclick = () => go('/packs'); $('#eDrop', page).onclick = simulateDrop;
}

/* ---------- 行为 ---------- */
function play(id) {
  const ins = instances.find(i => i.id === id); state.crash = state.crash === id ? null : state.crash;
  state.activity[id] = 'preparing'; refresh();
  setTimeout(() => {
    state.activity[id] = 'installing'; refresh();
    let done = 0; const total = 412;
    const t = setInterval(() => {
      done = Math.min(total, done + 20 + Math.random() * 40);
      const n = $('#instNum'); if (n && state.selected === id) n.textContent = `正在安装… ${Math.round(done)} / ${total} MB`;
      if (done >= total) { clearInterval(t); setTimeout(() => { delete state.activity[id]; state.running[id] = Date.now(); ins.lastPlayed = '刚刚'; refresh(); toast(overlays, `${ins.name} 已启动`); }, 300); }
    }, 160);
  }, 700);
}
function stop(id) { delete state.running[id]; refresh(); toast(overlays, `${instances.find(i => i.id === id).name} 已结束`); }
function refresh() { renderSidebar(); renderToolbar(); const p = scroll.querySelector('.pane:not(.out)'); if (p && location.hash.startsWith('#/instance')) renderHeroStatus(p); }

function moreItems(ins) { return [
  { icon: 'folder', label: '打开文件夹' }, { icon: 'package', label: '导出为 .mrpack…' }, { icon: 'refresh', label: '修复文件' }, '-',
  { icon: 'copy', label: '复制实例', run: () => duplicate(ins) }, { icon: 'pen', label: '重命名…', run: () => rename(ins) }, { icon: 'gear', label: '实例设置', run: () => { go('/instance/' + ins.id + '/settings'); } }, '-',
  { icon: 'trash', label: '删除实例', danger: true, run: () => confirmDelete(ins) } ]; }
function contextMenu(e, ins) { menu(main, e.clientX, e.clientY, [state.running[ins.id] ? { icon: 'stop', label: '结束游戏', run: () => stop(ins.id) } : { icon: 'play', label: '开始游戏', run: () => play(ins.id) }, { icon: ins.favorite ? 'star' : 'starFill', label: ins.favorite ? '取消收藏' : '收藏', run: () => { ins.favorite = !ins.favorite; refresh(); if (location.hash.startsWith('#/instance') && state.selected === ins.id) renderInstance(); } }, '-', ...moreItems(ins)]); }

function openNew(preset) {
  const { sheet, close } = openSheet(overlays, `<h4>新建实例</h4><p class="sub">不改任何项直接创建也没问题。</p>${newInstanceForm()}<div class="buttons"><button class="btn" data-close>取消</button><button class="btn primary" id="nCreate">创建</button></div>`);
  bindDisclosures(sheet); bindIconPick(sheet);
  if (typeof preset === 'string') { const b = $$('#nLoader button', sheet).find(b => b.textContent === preset); b && b.click(); }
  setTimeout(() => $('#nName', sheet).focus(), 60);
  $('#nCreate', sheet).onclick = () => {
    const loader = $('#nLoader [aria-selected="true"]', sheet).textContent; const ver = $('#nVer', sheet).value.replace(/（.*）|显示全部版本…/g, '') || '26.3';
    const name = $('#nName', sheet).value.trim() || ver; const biome = $('.iconpick button.on', sheet).title || 'forest';
    const id = 'n' + Date.now();
    instances.push({ id, name, loader: loader === '原版' ? null : loader, loaderVersion: loader === '原版' ? '' : '最新', version: ver, biome, lastPlayed: '从未', playtime: '0 分钟', hours: 0, favorite: false, mods: [], shaders: [], packs: [], worlds: [] });
    close(); state.tab = 'overview'; go('/instance/' + id); renderSidebar({ enter: id });
  };
}
function duplicate(ins) { const id = 'd' + Date.now(); instances.push({ ...ins, id, name: ins.name + ' 副本', favorite: false, lastPlayed: '从未', playtime: '0 分钟', hours: 0 }); go('/instance/' + id); renderSidebar({ enter: id }); toast(overlays, '实例已复制'); }
function rename(ins) { const { sheet, close } = openSheet(overlays, `<h4>重命名</h4><div class="field large"><input id="rn" value="${ins.name}"></div><div class="buttons"><button class="btn" data-close>取消</button><button class="btn primary" id="rnOk">重命名</button></div>`, 'confirm'); setTimeout(() => $('#rn', sheet).select(), 60); $('#rnOk', sheet).onclick = () => { ins.name = $('#rn', sheet).value.trim() || ins.name; close(); if (location.hash.startsWith('#/instance') && state.selected === ins.id) renderInstance(); renderSidebar(); }; }
function confirmDelete(ins) {
  const { sheet, close } = openSheet(overlays, `<h4>删除“${ins.name}”？</h4><p>它的 ${ins.worlds.length} 个存档和设置也会一起删除，不能撤销。</p><div class="buttons"><button class="btn" data-close>取消</button><button class="btn danger" id="doDel">删除实例</button></div>`, 'confirm');
  $('#doDel', sheet).onclick = () => {
    close(); const row = $(`.sb-row[data-id="${ins.id}"]`); row && row.classList.add('leave');
    setTimeout(() => { const i = instances.indexOf(ins); if (i >= 0) instances.splice(i, 1); delete state.running[ins.id]; delete state.activity[ins.id]; if (state.selected === ins.id) state.selected = instances[0]?.id; go(instances.length ? '/instance/' + state.selected : '/'); renderSidebar(); toast(overlays, '实例已删除', '撤销'); }, 280);
  };
}
function simulateDrop() {
  const d = el(`<div class="drop"><div class="box">${icon('import', 48)}拖入 .mrpack 即可导入</div></div>`); overlays.appendChild(d);
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 200); importPack(DATA.packs[0]); }, 1000);
}
function importPack(pack) {
  if (state.importing) return; state.importing = pack.name;
  $('#importSlot').innerHTML = `<div class="import-status enter"><span id="impText">正在安装「${pack.name}」… 0%</span><div class="progress"><i id="impBar"></i></div></div>`;
  let p = 0; const t = setInterval(() => {
    p = Math.min(100, p + 3 + Math.random() * 8); const bar = $('#impBar'), txt = $('#impText');
    if (bar) { bar.style.width = p + '%'; txt.textContent = `正在安装「${pack.name}」… ${Math.round(p)}%`; }
    if (p >= 100) { clearInterval(t); setTimeout(() => {
      const s = $('#importSlot').firstElementChild; if (s) { s.classList.add('leave'); setTimeout(() => s.remove(), 300); }
      const id = 'p' + Date.now();
      instances.push({ id, name: pack.name, loader: pack.loader, loaderVersion: '最新', version: pack.version, biome: pack.biome, lastPlayed: '从未', playtime: '0 分钟', hours: 0, favorite: false, mods: [...MODS.perf, ...MODS.qol.slice(0, 2)], shaders: [], packs: [], worlds: [] });
      state.importing = null; state.tab = 'overview'; go('/instance/' + id); renderSidebar({ enter: id }); toast(overlays, '整合包已安装');
    }, 300); }
  }, 150);
}
$('#accountBar').onclick = () => {
  if ($('.popover', $('#app'))) { $('.popover', $('#app')).remove(); return; }
  const p = el(`<div class="popover">${DATA.accounts.map(a => `<div class="prow" data-acc="${a.id}"><div class="avatar">${face(a.id, 30)}</div><div class="texts"><div>${a.name}</div><small>${a.kind}</small></div>${a.active ? `<span style="color:var(--accent)">${icon('check')}</span>` : ''}</div>`).join('')}<hr><div class="prow" style="color:var(--accent)">${icon('plus')}<div class="texts">添加账号…</div></div><div class="prow" data-go-acc>${icon('users')}<div class="texts">管理账号</div></div></div>`);
  $$('[data-acc]', p).forEach(r => r.onclick = () => { DATA.accounts.forEach(a => a.active = a.id === r.dataset.acc); p.remove(); renderSidebar(); });
  $('[data-go-acc]', p).onclick = () => { p.remove(); go('/settings/accounts'); };
  $('#app').appendChild(p);
  setTimeout(() => document.addEventListener('pointerdown', function h(e) { if (!p.contains(e.target) && !$('#accountBar').contains(e.target)) { p.remove(); document.removeEventListener('pointerdown', h); } }), 0);
};
$('#sbNew').onclick = () => openNew(); $('#sbPacks').onclick = () => go('/packs'); $('#sbSettings').onclick = () => go('/settings');
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'n') { e.preventDefault(); openNew(); } if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); go('/settings'); } });

/* ---------- 启动 ---------- */
applyTheme(ACCENT);
hydrateIcons();
designBar({ name: '方案三 · 素木', scenes: [{ id: 'welcome', label: '欢迎页' }, { id: 'crash', label: '模拟崩溃' }, { id: 'multi', label: '同时运行两个' }, { id: 'drop', label: '拖入整合包' }, { id: 'empty', label: '空状态' }, { id: 'reset', label: '重置' }],
  rerender: () => { applyTheme(ACCENT); renderSidebar(); }, scene: id => {
    if (id === 'welcome') { state.welcomeDone = false; go('/welcome'); }
    if (id === 'crash') { if (location.hash.startsWith('#/instance')) { delete state.running[state.selected]; delete state.activity[state.selected]; state.crash = state.selected; renderInstance(); renderSidebar(); } }
    if (id === 'multi') { ['survival', 'create'].forEach(id => { if (instances.find(i => i.id === id) && !state.running[id] && !state.activity[id]) play(id); }); }
    if (id === 'drop') simulateDrop();
    if (id === 'empty') { instances.splice(0, instances.length); state.running = {}; state.activity = {}; go('/'); renderSidebar(); }
    if (id === 'reset') location.reload();
  } });
router(parts => {
  $$('.runpop', overlays).forEach(x => x.remove()); $$('.popover', $('#app')).forEach(x => x.remove());
  const [p, a, b] = parts;
  if (!state.welcomeDone && p !== 'welcome') { go('/welcome'); return; }
  if (p === 'instance' && instances.find(i => i.id === a)) { state.selected = a; if (b) state.tab = b; renderInstance(); }
  else if (p === 'packs') renderPacks();
  else if (p === 'settings') { state.settingsSection = a || 'general'; renderSettings(); }
  else if (p === 'welcome') renderWelcome();
  else if (!instances.length) renderEmpty();
  else { go('/instance/' + (instances.find(i => i.id === state.selected) ? state.selected : instances[0].id)); return; }
  renderSidebar();
});
renderSidebar({ initial: true });
</script>
</body>
</html>
